name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I tested the current main branch or latest release.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Exact steps, inputs, route, and environment.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior and evidence
      description: Include logs or screenshots and relevant browser/OS versions.
    validations:
      required: true
