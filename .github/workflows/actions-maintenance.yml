name: Actions Maintenance

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-maintenance
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cleanup old workflow artifacts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RETENTION_DAYS: '14'
        with:
          retries: 3
          script: |
            const rawRetentionDays = process.env.RETENTION_DAYS || '';
            if (!/^[1-9][0-9]*$/.test(rawRetentionDays)) {
              core.setFailed(`RETENTION_DAYS must be a positive integer, received: ${rawRetentionDays || '<empty>'}`);
              return;
            }

            const retentionDays = Number.parseInt(rawRetentionDays, 10);
            if (!Number.isInteger(retentionDays) || retentionDays > 3650) {
              core.setFailed(`RETENTION_DAYS must be between 1 and 3650, received: ${rawRetentionDays}`);
              return;
            }

            const cutoff = Date.now() - (retentionDays * 24 * 60 * 60 * 1000);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
              response => response.data.artifacts,
            );

            const staleArtifacts = artifacts.filter((artifact) => (
              !artifact.expired && Date.parse(artifact.created_at) < cutoff
            ));

            let deleted = 0;
            for (const artifact of staleArtifacts) {
              core.info(`Deleting artifact ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              deleted += 1;
            }

            await core.summary
              .addHeading('Actions artifact retention')
              .addTable([
                [{ data: 'Retention days', header: true }, String(retentionDays)],
                [{ data: 'Scanned', header: true }, String(artifacts.length)],
                [{ data: 'Deleted', header: true }, String(deleted)],
              ])
              .write();

      - name: Report stale workflow artifacts
        run: echo "Artifact retention cleanup completed"
