name: Actions Maintenance

on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - (14 * 24 * 60 * 60 * 1000);
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of data.artifacts) {
              if (new Date(artifact.created_at).getTime() < cutoff && !artifact.expired) {
                core.info(`Deleting artifact ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Report stale workflow artifacts
        run: echo "Artifact retention cleanup completed"
