name: Diagnose PDF migration replacements

on:
  push:
    branches: [codex/full-audit-remediation]
    paths: [.github/workflows/apply-pdf-final.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation
      - name: Test every replacement
        shell: bash
        run: |
          cd far
          python3 - <<'PY' > reports-pdf-replacements.txt 2>&1
          import re, traceback
          from pathlib import Path
          checks = [
            ('scripts/vendor-libs.cjs', r"from: 'pdfjs-dist/build/pdf\.min\.js',\s*to: 'pdf\.min\.js',"),
            ('scripts/vendor-libs.cjs', r"from: 'pdfjs-dist/build/pdf\.worker\.min\.js',\s*to: 'pdf\.worker\.min\.js',"),
            ('index.html', r'<!-- PDF\.js \(vendored from pdfjs-dist@3\.11\.174\) -->\s*<script id="lib-pdfjs"\s*src="\./vendor/pdf\.min\.js"\s*defer></script>'),
            ('pdf.js', r'https://cdnjs\.cloudflare\.com/ajax/libs/pdf\.js/3\.11\.174/pdf\.min\.js'),
            ('pdf.js', r'\./vendor/pdf\.worker\.min\.js'),
            ('scripts/build.cjs', r"for \(const file of \['index\.html', 'manifest\.json', 'style\.css', 'boot\.js'\]\)"),
            ('scripts/build.cjs', r"('manifest\.json',\s*)('opencoursedeck\.js',)"),
            ('scripts/workbox.config.cjs', r"('boot\.js',\s*)('manifest\.json',)"),
            ('scripts/workbox-dist.config.cjs', r"('boot\.js',\s*)('manifest\.json',)"),
          ]
          try:
            for path, pattern in checks:
              text = Path(path).read_text(encoding='utf-8-sig')
              print(path, repr(pattern), 'matches=', len(re.findall(pattern, text, flags=re.MULTILINE)))
          except Exception:
            traceback.print_exc()
          PY
      - name: Commit replacement diagnostics
        shell: bash
        run: |
          rm .github/workflows/apply-pdf-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add far/reports-pdf-replacements.txt .github/workflows/apply-pdf-final.yml
          git commit -m "chore: diagnose PDF migration replacements"
          git push origin HEAD:codex/full-audit-remediation
