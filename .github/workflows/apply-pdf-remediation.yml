name: Diagnose confirmed PDF.js remediation

on:
  push:
    branches: [codex/full-audit-remediation]
    paths: [.github/workflows/apply-pdf-remediation.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Capture exact migration failure
        shell: bash
        run: |
          cd far
          set +e
          log=reports-pdf-4.10.38.txt
          : > "$log"
          run() { printf '\n=== %s ===\n' "$*" >> "$log"; "$@" >> "$log" 2>&1; printf 'exit=%s\n' "$?" >> "$log"; }
          run npm install pdfjs-dist@4.10.38 --save-exact --package-lock-only --ignore-scripts --legacy-peer-deps
          run npm ci --ignore-scripts --legacy-peer-deps
          run find node_modules/pdfjs-dist/build -maxdepth 1 -type f
          run npm audit --omit=dev --audit-level=high
          run test -f node_modules/pdfjs-dist/build/pdf.min.mjs
          run test -f node_modules/pdfjs-dist/build/pdf.worker.min.mjs
      - name: Commit diagnostics
        shell: bash
        run: |
          rm .github/workflows/apply-pdf-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add far/reports-pdf-4.10.38.txt .github/workflows/apply-pdf-remediation.yml
          git commit -m "chore: capture confirmed PDF migration failure"
          git push origin HEAD:codex/full-audit-remediation
