name: Audit DB Atomic Apply

on:
  push:
    branches:
      - fix/master-forensic-audit-remediation
    paths:
      - '.audit-remediation/db-atomic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-db-atomic-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/master-forensic-audit-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify staged patch checksum
        run: echo 'f78a584cda4aad3811ef4a3fbfd0fcd954ccbe1c386b14945e806880a6b02155  .audit-remediation/apply-db-atomic.cjs' | sha256sum --check --strict

      - name: Install dependencies reproducibly
        working-directory: far
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Apply atomic database patch
        run: node .audit-remediation/apply-db-atomic.cjs

      - name: Rebuild vendored assets
        working-directory: far
        run: npm run vendor

      - name: Run focused storage tests
        working-directory: far
        run: node node_modules/vitest/vitest.mjs run tests/db.test.js tests/storage-safety.test.js tests/bridge.test.js --configLoader runner --pool vmThreads

      - name: Run complete CI gate
        working-directory: far
        run: npm run ci

      - name: Commit verified remediation and remove temporary controls
        run: |
          rm -f .audit-remediation/apply-db-atomic.cjs
          rm -f .audit-remediation/db-atomic-trigger.txt
          rm -f .github/workflows/audit-db-atomic-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(storage): make annotation replacement atomic'
          git push origin HEAD:fix/master-forensic-audit-remediation
