name: Audit Regenerate Inter CSS

on:
  push:
    branches:
      - fix/master-forensic-audit-remediation
    paths:
      - '.audit-remediation/regenerate-inter-css-trigger.txt'

permissions:
  contents: write

concurrency:
  group: audit-regenerate-inter-css
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Install reproducibly and regenerate vendor assets
        working-directory: far
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm run vendor

      - name: Verify the generated change is narrowly scoped
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'far/vendor/fonts/inter/index.css'
          ! grep -q "font-family: 'Inter';" far/vendor/fonts/inter/index.css
          grep -q 'font-family: Inter;' far/vendor/fonts/inter/index.css

      - name: Validate generated artifacts and focused tests
        working-directory: far
        run: |
          npm run check:generated
          node node_modules/vitest/vitest.mjs run tests/annotation-persistence.test.js tests/bridge.test.js tests/runtime-wiring.test.js --configLoader runner --pool vmThreads

      - name: Commit regenerated asset and remove temporary controls
        run: |
          rm -f .audit-remediation/regenerate-inter-css-trigger.txt
          rm -f .github/workflows/audit-regenerate-inter-css.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(vendor): regenerate normalized Inter CSS'
          git push origin HEAD:fix/master-forensic-audit-remediation
