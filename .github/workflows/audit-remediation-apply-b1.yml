name: Audit Remediation Apply Phase B.1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-phase-b1:
    name: Apply verified browser and bundle fix
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/master-forensic-audit-remediation' &&
      github.actor == 'AmirrezaFarnamTaheri'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Decode, verify, and apply patch
        run: |
          set -euo pipefail
          echo "9419cc3cdf2420dfdc0b541a45c2bc0a150e82c3e56dc84ff7b30b53cfc59a8d  .audit-remediation/phase-b1.patch.gz.b64" | sha256sum --check --strict
          echo "6f2b5f95dcc8820056febff0d2b8f162391ac5f6138c8a82446f2815199bc669  .audit-remediation/phase-b1.patch.gz.b64.01" | sha256sum --check --strict
          echo "37f1866ae963d909a389304c8fbe202cfe598d7c672bd79e437f70946b1b9346  .audit-remediation/phase-b1.patch.gz.b64.02" | sha256sum --check --strict
          echo "a62d270b20075f8f65252194dd9e76138b18a27d282d5ccf6774b61ce6a72419  .audit-remediation/phase-b1.patch.gz.b64.03" | sha256sum --check --strict
          cat \
            .audit-remediation/phase-b1.patch.gz.b64 \
            .audit-remediation/phase-b1.patch.gz.b64.01 \
            .audit-remediation/phase-b1.patch.gz.b64.02 \
            .audit-remediation/phase-b1.patch.gz.b64.03 \
            | base64 -d | gzip -d > /tmp/phase-b1.patch
          echo "ba4b804f30e1425ae38392af0d2dc7466fba5067bdec7b5ec9d8419ecea404c5  /tmp/phase-b1.patch" | sha256sum --check --strict
          git apply --check /tmp/phase-b1.patch
          git apply /tmp/phase-b1.patch
          git diff --check

      - name: Install dependencies reproducibly
        working-directory: far
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor and build production distribution
        working-directory: far
        run: |
          npm run vendor
          npm run build:release
          npm run check:generated

      - name: Run focused regression tests
        working-directory: far
        run: node node_modules/vitest/vitest.mjs run tests/runtime-wiring.test.js tests/browser-smoke-script.test.js --configLoader runner --pool vmThreads

      - name: Enforce entry bundle budget
        working-directory: far
        run: npm run report:bundle

      - name: Exercise production Chromium smoke
        working-directory: far
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run smoke:dist-browser

      - name: Commit verified patch and generated artifacts
        run: |
          set -euo pipefail
          rm -rf .audit-remediation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: validate built workers and stabilize browser assurance"
          git push origin HEAD:fix/master-forensic-audit-remediation
