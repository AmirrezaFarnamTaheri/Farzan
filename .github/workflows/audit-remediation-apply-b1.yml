name: Audit Remediation Apply Phase B.1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-phase-b1:
    name: Apply verified browser and bundle fix
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/master-forensic-audit-remediation' &&
      github.actor == 'AmirrezaFarnamTaheri'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Decode, verify, and apply patch
        run: |
          set -euo pipefail
          echo "b02a8ffb6ba6f2de2d0d73623f4f3cf33c057c044967b1b6b2631c89e5e50889  .audit-remediation/phase-b1.patch.gz.b64" | sha256sum --check --strict
          echo "f0c37722730f28b2df18c79d6f26014b9bfe869d914ccf1edcff9ffefe8763a4  .audit-remediation/phase-b1.patch.gz.b64.01" | sha256sum --check --strict
          echo "4f1814f64e6de2c04945c449491c86b89283eda26c97ad8502b39746f33ac72f  .audit-remediation/phase-b1.patch.gz.b64.02" | sha256sum --check --strict
          echo "2252b6d97373365e52cddae6880c0acc4574b393fa2bb8fe0f3f0871d8fd3b81  .audit-remediation/phase-b1.patch.gz.b64.03" | sha256sum --check --strict
          echo "5958b27e5732058f070f98ebd99052366de887b92a3eef25a6c144df86455be6  .audit-remediation/phase-b1.patch.gz.b64.04" | sha256sum --check --strict
          cat \
            .audit-remediation/phase-b1.patch.gz.b64 \
            .audit-remediation/phase-b1.patch.gz.b64.01 \
            .audit-remediation/phase-b1.patch.gz.b64.02 \
            .audit-remediation/phase-b1.patch.gz.b64.03 \
            .audit-remediation/phase-b1.patch.gz.b64.04 \
            | base64 -d | gzip -d > /tmp/phase-b1.patch
          echo "a4557950f2b210ed47b226550285a9fb1b5322709f527d2bfedac5ad7c2d87f5  /tmp/phase-b1.patch" | sha256sum --check --strict
          git apply --check /tmp/phase-b1.patch
          git apply /tmp/phase-b1.patch
          git diff --check

      - name: Install dependencies reproducibly
        working-directory: far
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor and build production distribution
        working-directory: far
        run: |
          npm run vendor
          npm run build:release
          npm run check:generated

      - name: Run focused regression tests
        working-directory: far
        run: node node_modules/vitest/vitest.mjs run tests/runtime-wiring.test.js tests/browser-smoke-script.test.js --configLoader runner --pool vmThreads

      - name: Enforce entry bundle budget
        working-directory: far
        run: npm run report:bundle

      - name: Exercise production Chromium smoke
        working-directory: far
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run smoke:dist-browser

      - name: Commit verified patch and generated artifacts
        run: |
          set -euo pipefail
          rm -rf .audit-remediation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: validate built workers and stabilize browser assurance"
          git push origin HEAD:fix/master-forensic-audit-remediation
