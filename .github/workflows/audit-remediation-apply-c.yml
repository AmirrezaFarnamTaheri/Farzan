name: Audit Remediation Apply Phase C

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-phase-c:
    name: Apply verified supply-chain and governance patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/master-forensic-audit-remediation' &&
      github.actor == 'AmirrezaFarnamTaheri'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Decode, verify, and apply Phase C patch
        run: |
          set -euo pipefail
          echo "2f4cf784018c68214071b31b140dc51608ad14c784ea120b288659b5ceb30c77  .audit-remediation/phase-c.patch.gz.b64" | sha256sum --check --strict
          echo "ca2848d60170a16439f90101faf81176fd0d56c706d5cf3594620cc0f70a2c41  .audit-remediation/phase-c.patch.gz.b64.01" | sha256sum --check --strict
          echo "ceb9ea54268501827f40e69513f56bc9fd9d5ee37311ea72890e5002b3e3e803  .audit-remediation/phase-c.patch.gz.b64.02" | sha256sum --check --strict
          echo "9d0791347ce39f8c1bb6401441d29e78d72dce1afde2245cb64c8fcb03a0fcad  .audit-remediation/phase-c.patch.gz.b64.03" | sha256sum --check --strict
          echo "b20cf966cf3c04528e654333ada78a09a5cd38ab931083aa4a9df1954bf9fe29  .audit-remediation/phase-c.patch.gz.b64.04" | sha256sum --check --strict
          echo "1fe84585ccc740a23ea6de1430e5f3ff8927ee2e4fbc8bccb9eb867d60031e58  .audit-remediation/phase-c.patch.gz.b64.05" | sha256sum --check --strict
          echo "c4c85167e3d2a862af02ac409681281202be822e4f3d862062afa07aae7902cf  .audit-remediation/phase-c.patch.gz.b64.06" | sha256sum --check --strict
          echo "1ca653390bfb1d837228b5fd81d675625430c45ee78acb0c74fd4dc4e5755aa9  .audit-remediation/phase-c.patch.gz.b64.07" | sha256sum --check --strict
          echo "4c898ee9f722274ff0f7254e65059ffa6c75e4002dbe3fff107499d9fb139e0b  .audit-remediation/phase-c.patch.gz.b64.08" | sha256sum --check --strict
          echo "881f1a773794f4da6cd27a19f5ecce91b1d98705844bf28e4160e8b611350eec  .audit-remediation/phase-c.patch.gz.b64.09" | sha256sum --check --strict
          echo "a16bd65c219e4cb97db73712c40eeef09170d1bc75f92997551fbcdf58b1ba99  .audit-remediation/phase-c.patch.gz.b64.10" | sha256sum --check --strict
          echo "8b8982332cfdb944a31795de9b48da2329e5f56f8119e9ac70896cb96db0a91f  .audit-remediation/phase-c.patch.gz.b64.11" | sha256sum --check --strict
          echo "c7e9258bc5f7161fc1d0fb1d93542b7e71472ec415007b4152fb21acbb7af6e8  .audit-remediation/phase-c.patch.gz.b64.12" | sha256sum --check --strict
          cat .audit-remediation/phase-c.patch.gz.b64{,.01,.02,.03,.04,.05,.06,.07,.08,.09,.10,.11,.12} > /tmp/phase-c.patch.gz.b64
          echo "e557181d0d0139a936245045cc7a58a3bfc30d80d9584deb7858bf73d2e407ea  /tmp/phase-c.patch.gz.b64" | sha256sum --check --strict
          base64 -d /tmp/phase-c.patch.gz.b64 | gzip -d > /tmp/phase-c.patch
          echo "3a64a4ab8f13f35e50dcacc441970267fdb9d0d05ec8f37515c1c256b9d4e429  /tmp/phase-c.patch" | sha256sum --check --strict
          git apply --check /tmp/phase-c.patch
          git apply /tmp/phase-c.patch

          echo "374e03ca8009845874fcda8b24f6c2883e94f1249d46b0af7bb9ed46f24d9345  .audit-remediation/phase-c-lint.patch.gz.b64" | sha256sum --check --strict
          base64 -d .audit-remediation/phase-c-lint.patch.gz.b64 | gzip -d > /tmp/phase-c-lint.patch
          echo "48eb735e9fa504f582beae0efc85eee73e28b770837f9a554446f4827ad7cc22  /tmp/phase-c-lint.patch" | sha256sum --check --strict
          git apply --check /tmp/phase-c-lint.patch
          git apply /tmp/phase-c-lint.patch
          git diff --check

      - name: Install dependencies reproducibly
        working-directory: far
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Verify full supply-chain and release suite
        working-directory: far
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm run vendor
          npm run check:font-budget
          npm run ci

      - name: Commit verified Phase C patch and generated artifacts
        run: |
          set -euo pipefail
          rm -rf .audit-remediation
          rm -f .github/phase-c-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add supply-chain, governance, and font-budget controls"
          git push origin HEAD:fix/master-forensic-audit-remediation
