name: Audit Remediation Apply Phase C

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-phase-c:
    name: Apply verified supply-chain and governance patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/master-forensic-audit-remediation' &&
      github.actor == 'AmirrezaFarnamTaheri'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Decode, verify, and apply Phase C patch
        run: |
          set -euo pipefail
          echo "ba8ab88be251cb89b1f12992b42a6a851b98013148438a6712a80c53aad46555  .audit-remediation/phase-c.patch.gz.b64" | sha256sum --check --strict
          echo "788220ef8d9440ba7cfc0b07db15e5f471ea3d93dd1222e9f2a4facd9306ba0b  .audit-remediation/phase-c.patch.gz.b64.01" | sha256sum --check --strict
          echo "c3199f37e26a77607eb27d39d51e33a405f226901c763eeae7ced2bb86af300f  .audit-remediation/phase-c.patch.gz.b64.02" | sha256sum --check --strict
          echo "526d5d1be0777d6f10bf11642b089012a243639b3b397b7ef1a26f81b9463bf3  .audit-remediation/phase-c.patch.gz.b64.03" | sha256sum --check --strict
          echo "52ee8eea124b79b8b217a23d1d7eb0126a37862af1e2e2074cd086a5fb9b546a  .audit-remediation/phase-c.patch.gz.b64.04" | sha256sum --check --strict
          echo "a012e908a482902f388b8448f93bb64904667788840bc900d13b2cfe2363a159  .audit-remediation/phase-c.patch.gz.b64.05" | sha256sum --check --strict
          echo "907f7a3c38c62e28525fc64e9cf3aef77ceb88b725b51173859177dd13a912f6  .audit-remediation/phase-c.patch.gz.b64.06" | sha256sum --check --strict
          echo "da109e57177c97489fefb1fd3df976b2c07a6817d19e8c99ae15d57238d56e5d  .audit-remediation/phase-c.patch.gz.b64.07" | sha256sum --check --strict
          echo "0db7ab049f8a02762e88aed748c7f8540630c456f01ceddb5f617f476c3aadfc  .audit-remediation/phase-c.patch.gz.b64.08" | sha256sum --check --strict
          echo "f122796d8d66dd1f7c3390c37d657bb01efa05211e24537d433bbdba797d04aa  .audit-remediation/phase-c.patch.gz.b64.09" | sha256sum --check --strict
          echo "34cd62c9714d9ada336e4c51cdf1e6b8e90778a1797afaa894986268e10a5cdb  .audit-remediation/phase-c.patch.gz.b64.10" | sha256sum --check --strict
          echo "ee5a172b36873a086412d23c03aab76d31ad17784fa30fa1c422537c60bc7b3e  .audit-remediation/phase-c.patch.gz.b64.11" | sha256sum --check --strict
          echo "e6b3ee8489f8f87523ec5ed9f5c6ae29e4cf440ad41ef201b3e8054347127cf8  .audit-remediation/phase-c.patch.gz.b64.12" | sha256sum --check --strict
          cat .audit-remediation/phase-c.patch.gz.b64{,.01,.02,.03,.04,.05,.06,.07,.08,.09,.10,.11,.12} > /tmp/phase-c.patch.gz.b64
          echo "e557181d0d0139a936245045cc7a58a3bfc30d80d9584deb7858bf73d2e407ea  /tmp/phase-c.patch.gz.b64" | sha256sum --check --strict
          base64 -d /tmp/phase-c.patch.gz.b64 | gzip -d > /tmp/phase-c.patch
          echo "3a64a4ab8f13f35e50dcacc441970267fdb9d0d05ec8f37515c1c256b9d4e429  /tmp/phase-c.patch" | sha256sum --check --strict
          git apply --check /tmp/phase-c.patch
          git apply /tmp/phase-c.patch
          git diff --check

      - name: Install dependencies reproducibly
        working-directory: far
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Verify full supply-chain and release suite
        working-directory: far
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm run vendor
          npm run check:font-budget
          npm run ci

      - name: Commit verified Phase C patch and generated artifacts
        run: |
          set -euo pipefail
          rm -rf .audit-remediation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add supply-chain, governance, and font-budget controls"
          git push origin HEAD:fix/master-forensic-audit-remediation
