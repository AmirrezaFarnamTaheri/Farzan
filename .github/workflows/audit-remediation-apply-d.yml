name: Audit Remediation Apply Phase D

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-phase-d:
    name: Apply verified diagnostics and accessibility patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/master-forensic-audit-remediation' &&
      github.actor == 'AmirrezaFarnamTaheri'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Decode, verify, and apply Phase D patches
        run: |
          set -euo pipefail
          echo "e476e8a1af42c2572d29996aa7130270de6d695fd52696a59ae62eec293116f8  .audit-remediation/phase-d.patch.gz.b64" | sha256sum --check --strict
          echo "bbf95f8e7f0d03c5d10733335c7358f581ec9d6cec8486c5656425f909c24b1c  .audit-remediation/phase-d.patch.gz.b64.01" | sha256sum --check --strict
          echo "60caaae8660b8888f99c489d70980b86be9c7394d44492d84a5fa828c5043987  .audit-remediation/phase-d.patch.gz.b64.02" | sha256sum --check --strict
          echo "117d0ff1cc9be951b83dfba8cfccca05bfdbe9bb53851fa93107fd87d64bbbc7  .audit-remediation/phase-d.patch.gz.b64.03" | sha256sum --check --strict
          cat .audit-remediation/phase-d.patch.gz.b64{,.01,.02,.03} > /tmp/phase-d.patch.gz.b64
          echo "5a8692b2e0e6bcf32b59ea38532618ac523d941464c2b114ef5b653cf851948a  /tmp/phase-d.patch.gz.b64" | sha256sum --check --strict
          base64 -d /tmp/phase-d.patch.gz.b64 | gzip -d > /tmp/phase-d.patch
          echo "b529ebfd52970b208570112d22e45b918689628b3c58a9af4c01505f2fca4689  /tmp/phase-d.patch" | sha256sum --check --strict
          git apply --check /tmp/phase-d.patch
          git apply /tmp/phase-d.patch

          echo "6dd75293adffceabea4b801c15d7a580a89f45b2bc7e9005033f09f591e1d2f5  .audit-remediation/phase-d-diagnostics.patch.gz.b64" | sha256sum --check --strict
          base64 -d .audit-remediation/phase-d-diagnostics.patch.gz.b64 | gzip -d > /tmp/phase-d-diagnostics.patch
          echo "b8e58f9f2734c50f96c441bfaa9f2a8717a7ede43fbcd2ad7281e89a3c301bae  /tmp/phase-d-diagnostics.patch" | sha256sum --check --strict
          git apply --check /tmp/phase-d-diagnostics.patch
          git apply /tmp/phase-d-diagnostics.patch
          git diff --check

      - name: Install dependencies reproducibly
        working-directory: far
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Verify focused assurance contracts
        working-directory: far
        run: |
          npm run vendor
          node node_modules/vitest/vitest.mjs run tests/diagnostics.test.js tests/remote-origin-authority.test.js tests/integrity-property.test.js tests/browser-smoke-script.test.js --configLoader runner --pool vmThreads

      - name: Verify full application suite
        working-directory: far
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run ci

      - name: Commit verified Phase D patch
        run: |
          set -euo pipefail
          rm -rf .audit-remediation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add diagnostics, origin authority, and accessibility assurance"
          git push origin HEAD:fix/master-forensic-audit-remediation
