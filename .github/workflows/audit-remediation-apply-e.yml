name: Audit Remediation Apply Phase E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-phase-e:
    name: Apply verified dependency and native scaffold
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/master-forensic-audit-remediation' &&
      github.actor == 'AmirrezaFarnamTaheri'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify and materialize Phase E files
        run: |
          set -euo pipefail
          echo "7a9472ac0893fcd4293eec7f6bdb2d7799cb7bf460c26e2eda5acf6e1c721da6  .audit-remediation/phase-e-files.tar.gz.b64.00" | sha256sum --check --strict
          echo "ffa171d5cef670226892e0aff6caea9357ae1d2eae9fb04a500fffef0a0c5be9  .audit-remediation/phase-e-files.tar.gz.b64.01" | sha256sum --check --strict
          echo "0e9a2293e39cc5e65fe9ecd314b96bc2fdde6dd118acde69cf2037f1f2258aa2  .audit-remediation/phase-e-files.tar.gz.b64.02" | sha256sum --check --strict
          echo "07c1450be4553c005048a31adef0b1ec2a06ed21293b6beba058a133cc9c4485  .audit-remediation/phase-e-files.tar.gz.b64.03" | sha256sum --check --strict
          echo "fa6c6cb73b549dc9e4d42c330362a6cbfff371dbc4de368257c78f7d8e7bd3b5  .audit-remediation/phase-e-files.tar.gz.b64.04" | sha256sum --check --strict
          cat .audit-remediation/phase-e-files.tar.gz.b64.* > /tmp/phase-e-files.tar.gz.b64
          echo "177b8eeebaaeefd99df7f78aa360b313d9183c4c28a7be663b22a9be5ffd2c67  /tmp/phase-e-files.tar.gz.b64" | sha256sum --check --strict
          base64 -d /tmp/phase-e-files.tar.gz.b64 > /tmp/phase-e-files.tar.gz
          echo "e6e54aa0d3f3f8dd8316200178c32e7749bb9ba064bd05a31686f56e04d4d992  /tmp/phase-e-files.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/phase-e-files.tar.gz -C .

          echo "cf375f27065b2a9c760031ee858e41a395dfd17c36b822e54ec26699a6377af0  .audit-remediation/phase-e-test-delta.patch.gz.b64" | sha256sum --check --strict
          base64 -d .audit-remediation/phase-e-test-delta.patch.gz.b64 | gzip -d > /tmp/phase-e-test-delta.patch
          echo "07ebcda4a3d1a81cbf6b96839ba6e40db5a7050dad2bfa2237008dfa8708ca15  /tmp/phase-e-test-delta.patch" | sha256sum --check --strict
          git apply --check /tmp/phase-e-test-delta.patch
          git apply /tmp/phase-e-test-delta.patch
          git diff --check

      - name: Regenerate npm and Cargo lockfiles
        working-directory: far
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Install regenerated npm lockfile reproducibly
        working-directory: far
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Enforce dependency and native graph policy
        working-directory: far
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=low
          npm run native:preflight:strict
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          if (packages['node_modules/workbox-cli']) throw new Error('workbox-cli remains in the regenerated lockfile');
          if (packages['node_modules/sharp']?.version !== '0.35.3') throw new Error(`sharp version is ${packages['node_modules/sharp']?.version || 'missing'}`);
          if (packages['node_modules/ejs']?.version !== '6.0.1') throw new Error(`ejs version is ${packages['node_modules/ejs']?.version || 'missing'}`);
          NODE

      - name: Verify full web application suite
        working-directory: far
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm run vendor
          npm run ci

      - name: Commit verified dependency and native scaffold
        run: |
          set -euo pipefail
          rm -rf .audit-remediation
          rm -f .github/workflows/audit-remediation-apply-e.yml
          rm -f .github/workflows/audit-remediation-apply-d.yml
          rm -f .github/workflows/audit-remediation-dependencies.yml
          rm -f .github/dependency-remediation-trigger.txt
          rm -f .github/phase-c-sbom-trigger.txt
          rm -f .github/phase-e-trigger.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: close dependency and native scaffold blockers"
          git push origin HEAD:fix/master-forensic-audit-remediation
