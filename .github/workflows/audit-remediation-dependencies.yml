name: Audit Remediation Dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    name: Remediate development dependency advisories
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/master-forensic-audit-remediation' &&
      github.actor == 'AmirrezaFarnamTaheri'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: far
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install current lockfile reproducibly
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Record current advisory state
        run: npm audit --json > ../dependency-audit-before.json || true

      - name: Apply non-breaking lockfile remediation
        run: npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Reinstall remediated lockfile
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Require zero production vulnerabilities
        run: npm audit --omit=dev --audit-level=low

      - name: Require no high or critical development vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify full application suite
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm run vendor
          npm run ci

      - name: Commit lockfile remediation when changed
        working-directory: .
        run: |
          set -euo pipefail
          rm -f dependency-audit-before.json
          if git diff --quiet -- far/package-lock.json far/package.json; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add far/package-lock.json far/package.json
          git commit -m "chore: remediate development dependency advisories"
          git push origin HEAD:fix/master-forensic-audit-remediation
