name: Browser Assurance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser:
    name: Production Chromium assurance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: far
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out browser-assurance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor and build production distribution
        run: |
          npm run vendor
          npm run build:release

      - name: Run production browser smoke tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run smoke:dist-browser
