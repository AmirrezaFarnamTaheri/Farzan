name: Browser Assurance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: browser-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  production-browser:
    name: Production Chromium assurance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out browser-assurance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor and build production distribution
        run: |
          npm run vendor
          npm run build:release

      - name: Verify redesigned workspace at desktop and mobile sizes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:e2e -- tests/e2e/workspace-redesign.spec.js tests/e2e/user-library-dexie-compat.spec.js tests/e2e/css-rtl-200pct.spec.js

      - name: Run production browser smoke tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run smoke:dist-browser
