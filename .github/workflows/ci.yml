name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: far/package-lock.json
      - name: Apply remaining source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'far/index.html',
              '  <!-- PDF.js (vendored from pdfjs-dist@3.11.174) -->\n  <script id="lib-pdfjs"\n    src="./vendor/pdf.min.js"\n    defer></script>',
              '  <!-- PDF.js ESM runtime (vendored from patched pdfjs-dist) -->\n  <script type="module" src="./pdf-runtime.js"></script>',
          )
          replace_once('far/pdf.js', './vendor/pdf.worker.min.js', './vendor/pdf.worker.min.mjs')
          replace_once('far/pdf.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', './pdf-runtime.js')
          replace_once(
              'far/src/views/settingsRoute.js',
              "    } catch {\n      Toast?.error?.('Clear failed');\n    }",
              "    } catch (error) {\n      const failures = Array.isArray(error?.failures)\n        ? error.failures.map(item => item?.name || item?.message).filter(Boolean).join(', ')\n        : '';\n      const detail = failures || error?.message || 'Unknown storage error';\n      Toast?.error?.(`Clear failed: ${detail}`);\n    }",
          )

          assets = Path('far/tests/assets-precache.test.js')
          text = assets.read_text(encoding='utf-8')
          anchor = '    expect(refs.filter((rel) => !exists(rel))).toEqual([]);'
          addition = anchor + "\n    expect(html).not.toContain('vendor/pdf.min.js');\n    expect(html).toContain('pdf-runtime.js');"
          if addition not in text:
              if text.count(anchor) != 1: raise SystemExit('asset-test anchor mismatch')
              assets.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          settings = Path('far/tests/settings-route.test.js')
          text = settings.read_text(encoding='utf-8')
          test = """

  it('surfaces structured blocked-deletion failures', async () => {
    const { controller, Toast } = mountSettings();
    const error = new Error('Deletion blocked');
    error.failures = [{ name: 'opencoursedeck-templates' }, { message: 'primary database blocked' }];
    window.DB.clearUserData.mockRejectedValueOnce(error);
    document.querySelector('#btn-clear-scope').click();
    await vi.waitFor(() => expect(Toast.error).toHaveBeenCalledWith(expect.stringContaining('opencoursedeck-templates')));
    expect(Toast.error).toHaveBeenCalledWith(expect.stringContaining('primary database blocked'));
    controller.unmount();
  });
"""
          if 'surfaces structured blocked-deletion failures' not in text:
              marker = '\n});\n'
              pos = text.rfind(marker)
              if pos < 0: raise SystemExit('settings-test terminator missing')
              settings.write_text(text[:pos] + test + text[pos:], encoding='utf-8')
          PY
          rm -f .github/workflows/finish-pdf-esm-loader.yml \
            .github/workflows/migrate-pdf-source.yml \
            .github/workflows/patch-pdf-large-files.yml \
            .github/workflows/sync-pdf-lock-vendor.yml \
            far/reports-pdf-4.10.38.txt \
            far/reports-pdf-migration.txt \
            far/reports-pdf-replacements.txt
      - name: Verify complete remediation
        shell: bash
        run: |
          cd far
          npm ci --ignore-scripts --legacy-peer-deps
          npm run vendor
          npm run check:encoding
          npm run validate
          npm run lint
          npm run build:release
          npm run check:generated
          npm test
          npm audit --omit=dev --audit-level=high
          npm run audit
          npm run report:bundle
          npm run smoke
          npm run smoke:browser
      - name: Commit verified fixes and restore CI
        shell: bash
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete PR remediation and test coverage"
          git push origin HEAD:codex/full-audit-remediation
