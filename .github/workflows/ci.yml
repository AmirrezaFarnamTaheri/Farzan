name: CI

run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ github.sha }}
      release_mode: false
      node_version: '22'
