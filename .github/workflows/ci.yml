name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: far

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor browser dependencies
        run: npm run vendor

      - name: Check encoding
        run: npm run check:encoding

      - name: Validate repository
        run: npm run validate

      - name: Lint source
        run: |
          mkdir -p reports
          npm run lint -- --format json --output-file reports/eslint.json

      - name: Build release
        run: npm run build:release

      - name: Verify generated artifacts
        run: npm run check:generated

      - name: Verify committed artifacts are current
        run: git diff --exit-code --stat -- dist vendor

      - name: Generate and verify release attestation
        run: npm run release:attest

      - name: Run adversarial release integrity tests
        run: node scripts/adversarial-release-test.cjs

      - name: Run tests
        run: npm test

      - name: Audit production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Audit project rules
        run: npm run audit

      - name: Run smoke tests
        run: npm run smoke

      - name: Run browser smoke tests
        run: npm run smoke:browser
