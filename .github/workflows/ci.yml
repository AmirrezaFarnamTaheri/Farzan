name: CI

run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ github.sha }}
      release_mode: false
      node_version: '22'

  reconcile-generated:
    name: Reconcile generated artifacts
    if: github.event_name == 'pull_request' && github.head_ref == 'integration/unify-open-prs-2026-08-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Check out exact integration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Regenerate tracked outputs
        run: |
          npm --prefix far ci --ignore-scripts --legacy-peer-deps
          npm --prefix far run vendor
          npm --prefix far run build:release

      - name: Commit exact generated outputs
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git diff --check
          git status --short -- far/vendor far/dist
          if git diff --quiet -- far/vendor far/dist; then
            echo 'Generated artifacts are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add far/vendor far/dist
          git commit -m 'chore(generated): reconcile upgraded vendor assets'
          git push origin "HEAD:${HEAD_REF}"
