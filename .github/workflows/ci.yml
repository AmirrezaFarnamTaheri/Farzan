name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: far

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor browser dependencies
        run: npm run vendor

      - name: Check encoding
        run: npm run check:encoding

      - name: Validate repository
        run: npm run validate

      - name: Lint source
        run: npm run lint

      - name: Build release
        run: npm run build:release

      - name: Verify generated artifacts
        run: npm run check:generated

      - name: Run tests
        run: npm test

      - name: Audit dependencies and project rules
        run: npm run audit

      - name: Generate bundle report
        run: npm run report:bundle

      - name: Run smoke tests
        run: npm run smoke

      - name: Run browser smoke tests
        run: npm run smoke:browser
