name: CI

run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ github.sha }}
      release_mode: false
      node_version: '22'

  correct-release-workflows:
    name: Correct and remove temporary workflow patch
    if: github.event_name == 'pull_request' && github.head_ref == 'integration/unify-open-prs-2026-08-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Check out exact integration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed corrections and self-remove
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expression_open = '$' + '{{'
          expression_close = '}}'

          verify = Path('.github/workflows/verify.yml')
          verify_text = verify.read_text()
          old_depth = f"fetch-depth: {expression_open} inputs.release_mode && 0 || 1 {expression_close}"
          new_depth = f"fetch-depth: {expression_open} inputs.release_mode && '0' || '1' {expression_close}"
          if verify_text.count(old_depth) != 1:
              raise SystemExit(f'expected one release fetch-depth expression, found {verify_text.count(old_depth)}')
          verify.write_text(verify_text.replace(old_depth, new_depth))

          release = Path('.github/workflows/release.yml')
          release_text = release.read_text()
          old_cache = """        with:
            node-version: '22'
            cache: npm
            cache-dependency-path: far/package-lock.json
          """
          new_cache = """        with:
            node-version: '22'
          """
          if release_text.count(old_cache) != 1:
              raise SystemExit(f'expected one resolver cache block, found {release_text.count(old_cache)}')
          release.write_text(release_text.replace(old_cache, new_cache))

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          marker = '\n  correct-release-workflows:\n'
          permanent, found, _temporary = ci_text.partition(marker)
          if not found:
              raise SystemExit('temporary correction job marker was not found')
          ci.write_text(permanent.rstrip() + '\n')
          PY

          git diff --check
          git diff -- .github/workflows/ci.yml .github/workflows/verify.yml .github/workflows/release.yml

      - name: Commit corrected permanent workflows
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/verify.yml .github/workflows/release.yml
          git commit -m 'fix(ci): harden release verification workflows'
          git push origin "HEAD:${HEAD_REF}"
