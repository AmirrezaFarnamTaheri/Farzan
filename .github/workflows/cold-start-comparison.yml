name: Controlled Cold Start Comparison

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/cold-start-comparison.cjs'
      - 'scripts/dist-browser-smoke.cjs'
      - 'tests/cold-start-comparison.test.js'
      - '.github/workflows/cold-start-comparison.yml'
  workflow_dispatch:

concurrency:
  group: cold-start-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  controlled-first-visit:
    name: Matched baseline and current Chromium cold visits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    env:
      FARZAN_BASELINE_REF: d8a4ca3bb7b397816fb29cacfe0ac3b86833ab96
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Check out exact current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build exact current production distribution
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm run vendor
          npm run build:release

      - name: Build immutable pre-deferral baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/farzan-cold-baseline" "$FARZAN_BASELINE_REF"
          (
            cd "$RUNNER_TEMP/farzan-cold-baseline"
            npm ci --ignore-scripts --legacy-peer-deps
            npm run vendor
            npm run build:release
          )

      - name: Measure paired fresh-profile Chromium first visits
        run: |
          node scripts/cold-start-comparison.cjs \
            "$RUNNER_TEMP/farzan-cold-baseline/dist" \
            "$GITHUB_WORKSPACE/dist"

      - name: Upload inspectable cold-start comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: farzan-controlled-cold-start-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/ci/controlled-cold-start.json
          if-no-files-found: warn
          retention-days: 7
