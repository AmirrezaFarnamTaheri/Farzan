name: Diagnose PDF.js migration

on:
  push:
    branches: [codex/full-audit-remediation]
    paths: [.github/workflows/complete-pr-remediation.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Capture package layout and advisory result
        shell: bash
        run: |
          cd far
          set +e
          npm install pdfjs-dist@4.2.67 --save-exact --package-lock-only --ignore-scripts --legacy-peer-deps > reports-pdf-migration.txt 2>&1
          npm ci --ignore-scripts --legacy-peer-deps >> reports-pdf-migration.txt 2>&1
          printf '\n--- pdfjs-dist files ---\n' >> reports-pdf-migration.txt
          find node_modules/pdfjs-dist -maxdepth 3 -type f | sort >> reports-pdf-migration.txt 2>&1
          printf '\n--- production audit ---\n' >> reports-pdf-migration.txt
          npm audit --omit=dev --audit-level=high >> reports-pdf-migration.txt 2>&1
          exit 0
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          rm .github/workflows/complete-pr-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add far/reports-pdf-migration.txt .github/workflows/complete-pr-remediation.yml
          git commit -m "chore: capture PDF.js migration diagnostics"
          git push origin HEAD:codex/full-audit-remediation
