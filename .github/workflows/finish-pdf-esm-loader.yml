name: Finish PDF.js ESM loader migration

on:
  push:
    branches: [codex/full-audit-remediation]
    paths: [.github/workflows/finish-pdf-esm-loader.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation
          fetch-depth: 0
      - name: Replace retired PDF.js loader references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'far/index.html',
              '  <!-- PDF.js (vendored from pdfjs-dist@3.11.174) -->\n  <script id="lib-pdfjs"\n    src="./vendor/pdf.min.js"\n    defer></script>',
              '  <!-- PDF.js ESM runtime (vendored from patched pdfjs-dist) -->\n  <script type="module" src="./pdf-runtime.js"></script>',
          )
          replace_once(
              'far/pdf.js',
              './vendor/pdf.worker.min.js',
              './vendor/pdf.worker.min.mjs',
          )
          replace_once(
              'far/pdf.js',
              'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
              './pdf-runtime.js',
          )

          test = Path('far/tests/assets-precache.test.js')
          text = test.read_text(encoding='utf-8')
          anchor = "expect(missing).toEqual([]);"
          addition = "expect(missing).toEqual([]);\n    expect(html).not.toContain('vendor/pdf.min.js');\n    expect(html).toContain('pdf-runtime.js');"
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'assets-precache test anchor count: {text.count(anchor)}')
              test.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Verify focused tests
        shell: bash
        run: |
          cd far
          npm ci --ignore-scripts --legacy-peer-deps
          npm run vendor
          npm test -- --run tests/assets-precache.test.js
      - name: Commit loader migration
        shell: bash
        run: |
          rm .github/workflows/finish-pdf-esm-loader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add far/index.html far/pdf.js far/tests/assets-precache.test.js .github/workflows/finish-pdf-esm-loader.yml
          git commit -m "fix: complete PDF.js ESM loader migration"
          git push origin HEAD:codex/full-audit-remediation