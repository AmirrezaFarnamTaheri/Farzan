name: Generated Artifact Diagnostics

on:
  pull_request:
    paths:
      - far/scripts/check-generated.cjs
      - .github/workflows/generated-artifact-diagnostics.yml
  workflow_dispatch:

concurrency:
  group: generated-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: far

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor browser dependencies
        run: npm run vendor

      - name: Build release
        run: npm run build:release

      - name: Compare generated artifacts
        id: generated
        continue-on-error: true
        run: npm run check:generated

      - name: Upload generated bundle comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-bundle-diff-${{ github.run_number }}
          path: |
            far/reports/generated-diff/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail when generated output differs
        if: steps.generated.outcome == 'failure'
        run: exit 1
