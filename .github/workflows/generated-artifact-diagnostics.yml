name: Generated Artifact Diagnostics

on:
  pull_request:
    paths:
      - far/src/**
      - far/*.js
      - far/index.html
      - far/style.css
      - far/manifest.json
      - far/package.json
      - far/package-lock.json
      - far/scripts/build.cjs
      - far/scripts/build-sw-dist.cjs
      - far/scripts/check-generated.cjs
      - far/scripts/workbox-dist.config.cjs
      - .github/workflows/generated-artifact-diagnostics.yml
  workflow_dispatch:

concurrency:
  group: generated-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: far

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor browser dependencies
        run: npm run vendor

      - name: Build release
        run: npm run build:release

      - name: Verify deterministic generated output
        id: generated
        continue-on-error: true
        run: npm run check:generated

      - name: Compare committed artifacts
        id: committed
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/generated-diff
          git status --porcelain=v1 --untracked-files=all -- dist vendor > reports/generated-diff/status.txt
          if [[ -s reports/generated-diff/status.txt ]]; then
            git diff --stat -- dist vendor > reports/generated-diff/stat.txt
            git diff --binary -- dist vendor > reports/generated-diff/generated.patch
            tar -czf reports/generated-diff/generated-files.tar.gz dist vendor
            exit 1
          fi
          rm -f reports/generated-diff/status.txt

      - name: Upload generated bundle comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-bundle-diff-${{ github.run_number }}
          path: |
            far/reports/generated-diff/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail when generated output differs
        if: steps.generated.outcome == 'failure' || steps.committed.outcome == 'failure'
        run: exit 1
