name: Native Windows Assurance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'far/src-tauri/**'
      - 'far/assets/icon-192.svg'
      - 'far/scripts/native-*.cjs'
      - 'far/scripts/prepare-native-assets.cjs'
      - 'far/scripts/stage-native-exe.cjs'
      - 'far/package.json'
      - 'far/package-lock.json'
      - '.github/workflows/native-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    name: Locked Cargo check and release build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: far
        shell: pwsh
    steps:
      - name: Check out native source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Report native toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose
          node --version
          npm --version

      - name: Install JavaScript dependencies reproducibly
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build production frontend and native assets
        run: |
          npm run vendor
          npm run native:prepare
          npm run build:release

      - name: Enforce strict native prerequisites
        run: npm run native:preflight:strict

      - name: Validate Cargo graph with lockfile
        run: npm run tauri:check:locked

      - name: Build Windows release binary with lockfile
        run: npm run tauri:build:locked

      - name: Verify release executable
        run: |
          $exe = Join-Path $PWD 'src-tauri\target\release\open-course-deck.exe'
          if (-not (Test-Path $exe)) { throw "Native executable not found: $exe" }
          $item = Get-Item $exe
          if ($item.Length -le 0) { throw 'Native executable is empty' }
          $hash = Get-FileHash -Algorithm SHA256 $exe
          "$($hash.Hash.ToLowerInvariant())  open-course-deck.exe" | Set-Content -Encoding ascii native-sha256.txt
          Get-Content native-sha256.txt

      - name: Upload native verification artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            far/src-tauri/target/release/open-course-deck.exe
            far/native-sha256.txt
          if-no-files-found: error
          retention-days: 7
