name: One-shot app-core patch

on:
  push:
    branches:
      - codex/full-audit-remediation
    paths:
      - .github/workflows/patch-app-core.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation

      - name: Apply exact test-contract updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('far/tests/app-core.test.js')
          text = path.read_text(encoding='utf-8-sig')

          replacements = [
              (
                  "import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';\n",
                  "import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';\nimport { initEndpointApprovalGuard } from '../src/core/endpointApprovalGuard.js';\n",
              ),
              (
                  "  window.OpenCourseDeck = { bus: { emit: vi.fn(), on: vi.fn(), off: vi.fn() } };\n  await import('../app.js');\n",
                  "  window.OpenCourseDeck = { bus: { emit: vi.fn(), on: vi.fn(), off: vi.fn() } };\n  initEndpointApprovalGuard(document);\n  await import('../app.js');\n",
              ),
              (
                  "expect(view.querySelector('[data-storage-summary]').textContent).toContain('90%');",
                  "expect(view.querySelector('[data-storage-percent]').textContent).toBe('90%');",
              ),
              (
                  "    document.querySelector('[data-ai-endpoint]').value = 'https://api.example.test/v1/chat/completions';\n    document.querySelector('[data-ai-key-storage]').value = 'session';\n    document.querySelector('[data-ai-key]').value = 'session-key';\n    document.querySelector('[data-ai-save]').click();\n",
                  "    const endpoint = document.querySelector('[data-ai-endpoint]');\n    const approval = document.querySelector('[data-ai-approve-endpoint]');\n    endpoint.value = 'https://api.example.test/v1/chat/completions';\n    endpoint.dispatchEvent(new Event('input', { bubbles: true }));\n    document.querySelector('[data-ai-key-storage]').value = 'session';\n    document.querySelector('[data-ai-key]').value = 'session-key';\n    approval.checked = true;\n    approval.dispatchEvent(new Event('change', { bubbles: true }));\n    document.querySelector('[data-ai-save]').click();\n",
              ),
              (
                  "    expect(document.querySelector('[data-ai-summary]').textContent).toContain('Stored for this session');\n\n    document.querySelector('[data-ai-key-storage]').value = 'local';\n    document.querySelector('[data-ai-key]').value = 'local-key';\n    document.querySelector('[data-ai-save]').click();\n\n    await vi.waitFor(() => expect(saveSetting).toHaveBeenLastCalledWith('plasma-ai-settings', expect.objectContaining({\n      keyStorage: 'local',\n      apiKey: 'local-key',\n      hasKey: true,\n    })));\n\n    document.querySelector('[data-ai-clear-key]').click();\n",
                  "    expect(document.querySelector('[data-ai-summary]').textContent).toContain('Available for this session');\n    expect(document.querySelector('[data-ai-key-storage]').disabled).toBe(true);\n    expect(document.querySelector('[data-ai-key-storage]').value).toBe('session');\n\n    document.querySelector('[data-ai-clear-key]').click();\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/patch-app-core.yml').unlink()
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add far/tests/app-core.test.js .github/workflows/patch-app-core.yml
          git commit -m "test(settings): align integration contracts"
          git push origin HEAD:codex/full-audit-remediation
