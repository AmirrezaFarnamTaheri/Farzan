name: One-shot storage progress test patch

on:
  push:
    branches:
      - codex/full-audit-remediation
    paths:
      - .github/workflows/patch-storage-progress-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation

      - name: Apply storage progress selector update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('far/tests/app-core.test.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [
              index for index, line in enumerate(lines)
              if "querySelector('[role=\"progressbar\"]')" in line
              and "aria-valuenow" in line
              and "toBe('90')" in line
          ]
          if len(matches) != 1:
              raise SystemExit(f'Expected one storage progress assertion, found {len(matches)}')
          lines[matches[0]] = "    expect(view.querySelector('[data-storage-bar]').closest('[role=\"progressbar\"]').getAttribute('aria-valuenow')).toBe('90');"
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/workflows/patch-storage-progress-test.yml').unlink()
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add far/tests/app-core.test.js .github/workflows/patch-storage-progress-test.yml
          git commit -m "test(settings): target storage progress meter"
          git push origin HEAD:codex/full-audit-remediation
