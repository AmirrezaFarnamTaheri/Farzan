name: Plasmato Edition - Verify and Publish

on:
  push:
    branches:
      - edition/plasmato-emergency-player-20261011
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmato-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Verify native catalog and build both web apps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out edition source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify supplied archive and native catalog integration
        run: |
          node editions/plasmato-emergency/verify.cjs
          node editions/plasmato-emergency/verify-integrated.cjs
          node --check editions/plasmato-emergency/app.js
          node --check editions/plasmato-emergency/catalog_data.js
          node --check editions/plasmato-emergency/extract.cjs
          node --check editions/plasmato-emergency/verify.cjs
          node --check editions/plasmato-emergency/verify-integrated.cjs

      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate vendor libraries
        run: npm run vendor

      - name: Validate source and workflow contracts
        run: |
          npm run check:encoding
          npm run check:workflows
          npm run validate
          npm run lint

      - name: Build production applications
        run: |
          npm run build:release
          npm run check:generated
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          for (const file of [
            'dist/index.html',
            'dist/opencoursedeck.js',
            'dist/data/catalog.json',
            'dist/data/plasmato-2026-04-11.json.gz',
            'dist/editions/plasmato-emergency/index.html',
            'dist/editions/plasmato-emergency/app.js',
            'dist/editions/plasmato-emergency/catalog_data.js',
            'dist/sw.js',
          ]) assert(fs.statSync(file).size > 0, 'Missing production asset: ' + file);
          const pointer = JSON.parse(fs.readFileSync('dist/data/catalog.json', 'utf8'));
          assert.equal(pointer.additionalCatalogs?.length, 1);
          const worker = fs.readFileSync('dist/sw.js', 'utf8');
          assert(worker.includes('plasmato-2026-04-11.json.gz'), 'Offline SW must precache native catalog');
          assert(worker.includes('editions/plasmato-emergency/index.html'), 'Offline SW must precache standalone viewer');
          NODE

      - name: Run all repository unit and integration tests
        run: npm test

      - name: Run release security and runtime checks
        run: |
          npm run audit
          npm audit --omit=dev --audit-level=high
          npm run smoke
          npm run smoke:dist-browser
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Exercise visual and functional app acceptance in Chrome
        run: npm run test:e2e -- tests/e2e/plasmato-visual.spec.js tests/e2e/plasmato-visual-expanded.spec.js tests/e2e/plasmato-visual-deep.spec.js
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Render visual contact sheets for every screenshot state
        if: always()
        run: node scripts/visual-contact-sheet.cjs

      - name: Verify all 476 screenshots, observations and SHA-256 manifest
        run: node scripts/check-visual-evidence.cjs

      - name: Upload screenshot matrix, interaction captures, and browser traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: farzan-plasmato-edition-v1.0.4-visual-evidence
          path: |
            artifacts/visual-audit/
            test-results/
          if-no-files-found: warn
          retention-days: 90

      - name: Package complete installable static site
        run: |
          mkdir -p release-assets
          (cd dist && zip -q -r ../release-assets/farzan-plasmato-edition-v1.0.4-web.zip .)
          (cd release-assets && sha256sum farzan-plasmato-edition-v1.0.4-web.zip > SHA256SUMS)
          test -f artifacts/visual-audit/manifest.json
          test -f artifacts/visual-audit/VISUAL-REPORT.md
          test -f artifacts/visual-audit/observations.jsonl
          zip -q -r release-assets/farzan-plasmato-edition-v1.0.4-visual-evidence.zip artifacts/visual-audit
          (cd release-assets && sha256sum farzan-plasmato-edition-v1.0.4-visual-evidence.zip > SHA256SUMS.visual)

      - name: Upload verified downloadable app and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: farzan-plasmato-edition-v1.0.4-web
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

      - name: Upload static site for GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  build-windows:
    name: Build independent Plasmato Windows NSIS installer
    needs: build-and-verify
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out verified edition source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies and prepare native assets
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run vendor
          if ($LASTEXITCODE -ne 0) { throw "Vendor generation failed" }
          npm run native:prepare
          if ($LASTEXITCODE -ne 0) { throw "Native icon preparation failed" }

      - name: Verify isolated Tauri installer identity and locked prerequisites
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.productName -ne 'Farzan Plasmato Edition' -or $config.identifier -ne 'app.opencoursedeck.plasmato') {
            throw "Plasmato native installer must have an edition-specific product and bundle identifier"
          }
          npm run native:preflight:strict
          if ($LASTEXITCODE -ne 0) { throw "Native preflight failed" }

      - name: Compile real NSIS installer using locked Cargo graph
        run: |
          npm run native:package:locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri Windows installer build failed" }

      - name: Verify and stage the Windows installer
        run: |
          $found = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($found.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($found.Count)" }
          if ($found[0].Length -lt 1000000) { throw "Windows installer is unexpectedly small" }
          New-Item -ItemType Directory -Path 'release-native' -Force | Out-Null
          $dest = 'release-native/farzan-plasmato-edition-v1.0.4-windows-setup.exe'
          Copy-Item -LiteralPath $found[0].FullName -Destination $dest
          $digest = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
          "$digest  farzan-plasmato-edition-v1.0.4-windows-setup.exe" |
            Out-File 'release-native/SHA256SUMS.windows' -Encoding ascii
          Get-Content 'release-native/SHA256SUMS.windows'

      - name: Upload verified Windows installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: farzan-plasmato-edition-v1.0.4-windows
          path: release-native/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish versioned Plasmato Edition download
    needs: [build-and-verify, build-windows]
    if: github.ref == 'refs/heads/edition/plasmato-emergency-player-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified edition bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: farzan-plasmato-edition-v1.0.4-web
          path: release-assets

      - name: Download verified Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: farzan-plasmato-edition-v1.0.4-windows
          path: release-assets

      - name: Verify release bytes and immutable version identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS)
          (cd release-assets && sha256sum -c SHA256SUMS.windows)
          (cd release-assets && sha256sum -c SHA256SUMS.visual)
          tag=plasmato-edition-v1.0.4
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null | grep -E '^[a-f0-9]{40}$' || :)
          if [[ -n "$existing" && "$existing" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Version tag ${tag} is immutable and points to ${existing}; bump the edition version to publish a new build."
            exit 1
          fi

      - name: Publish Plasmato Edition v1.0.4
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: plasmato-edition-v1.0.4
          target_commitish: ${{ github.sha }}
          name: Farzan Plasmato Edition v1.0.4
          body: |
            Branch-specific edition of Farzan/OpenCourseDeck, built from the full Plasmato archive.
            Contains 31 imported Plasmato courses (6,418 topics, 5,990 video and 280 PDF references)
            alongside Farzan's existing starter course, plus the standalone emergency player.
            Includes the production website, offline worker and independent NSIS installer, with SHA-256 checksums.
            Visual release acceptance verifies 15 routes across desktop, tablet, mobile and light mode,
            actual saved notes, PDF, flashcards, progress, video/bookmarks, search and Studio persistence.
            Download the visual evidence ZIP for 308 genuine Chrome screenshots, 24 review contact sheets, browser observations, and image SHA-256 manifest.
            Extract the ZIP and serve it over HTTP(S). External video and PDF hosts are not mirrored.
            This edition is not merged to main and is distinct from standard Farzan releases.
          files: |
            release-assets/farzan-plasmato-edition-v1.0.4-web.zip
            release-assets/SHA256SUMS
            release-assets/farzan-plasmato-edition-v1.0.4-windows-setup.exe
            release-assets/SHA256SUMS.windows
            release-assets/farzan-plasmato-edition-v1.0.4-visual-evidence.zip
            release-assets/SHA256SUMS.visual
          fail_on_unmatched_files: true
          overwrite_files: false
          make_latest: false

  publish-pages:
    name: Publish Plasmato Edition web application
    needs: build-and-verify
    if: github.ref == 'refs/heads/edition/plasmato-emergency-player-20261011' && vars.ENABLE_PLASMATO_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Plasmato web app
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
