name: Plasmato Edition Integrity

on:
  push:
    branches:
      - edition/plasmato-emergency-player-20261011
    paths:
      - 'editions/plasmato-emergency/**'
      - '.github/workflows/plasmato-edition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmato-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-edition:
    name: Verify Plasmato offline snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out edition source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify bundled hierarchy and untrusted URL rejection
        run: node editions/plasmato-emergency/verify.cjs

      - name: Validate standalone JavaScript source
        run: |
          node --check editions/plasmato-emergency/app.js
          node --check editions/plasmato-emergency/catalog_data.js
          node --check editions/plasmato-emergency/extract.cjs
          node --check editions/plasmato-emergency/verify.cjs
