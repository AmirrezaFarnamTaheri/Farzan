name: Plasmato Edition - Verify and Publish

on:
  # Publication is an explicit versioned main-branch change, never an
  # unreviewed edition-branch push. A new edition.json version is the trigger.
  push:
    branches:
      - main
    paths:
      - editions/plasmato-emergency/edition.json
  # Exercise build and real NSIS packaging before the release PR merges.
  pull_request:
    paths:
      - .github/workflows/plasmato-edition.yml
      - editions/plasmato-emergency/edition.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plasmato-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Verify native catalog and build both web apps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out edition source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify isolated edition release version and catalog
        run: |
          node -e "const c=require('./editions/plasmato-emergency/edition.json'); if(c.editionVersion !== '1.0.6') throw new Error('Edition version does not match immutable v1.0.6 release contract')"

      - name: Verify supplied archive and native catalog integration
        run: |
          node editions/plasmato-emergency/verify.cjs
          node editions/plasmato-emergency/verify-integrated.cjs
          node --check editions/plasmato-emergency/app.js
          node --check editions/plasmato-emergency/catalog_data.js
          node --check editions/plasmato-emergency/extract.cjs
          node --check editions/plasmato-emergency/verify.cjs
          node --check editions/plasmato-emergency/verify-integrated.cjs

      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Generate vendor libraries
        run: npm run vendor

      - name: Validate source and workflow contracts
        run: |
          npm run check:encoding
          npm run check:workflows
          npm run validate
          npm run lint

      - name: Build production applications
        run: |
          npm run build:release
          npm run check:generated
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          for (const file of [
            'dist/index.html',
            'dist/opencoursedeck.js',
            'dist/data/catalog.json',
            'dist/data/plasmato-2026-04-11.json.gz',
            'dist/editions/plasmato-emergency/index.html',
            'dist/editions/plasmato-emergency/app.js',
            'dist/editions/plasmato-emergency/catalog_data.js',
            'dist/sw.js',
          ]) assert(fs.statSync(file).size > 0, 'Missing production asset: ' + file);
          const pointer = JSON.parse(fs.readFileSync('dist/data/catalog.json', 'utf8'));
          assert.equal(pointer.additionalCatalogs?.length, 1);
          const worker = fs.readFileSync('dist/sw.js', 'utf8');
          assert(worker.includes('plasmato-2026-04-11.json.gz'), 'Offline SW must precache native catalog');
          assert(worker.includes('editions/plasmato-emergency/index.html'), 'Offline SW must precache standalone viewer');
          NODE

      - name: Run all repository unit and integration tests
        run: npm test

      - name: Run release security and runtime checks
        run: |
          npm run audit
          npm audit --omit=dev --audit-level=high
          npm run smoke
          npm run smoke:dist-browser
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Exercise visual and functional app acceptance in Chrome
        run: npm run test:e2e -- tests/e2e/plasmato-visual.spec.js tests/e2e/plasmato-visual-expanded.spec.js tests/e2e/plasmato-visual-deep.spec.js tests/e2e/workspace-redesign.spec.js tests/e2e/workspace-visual-qa.spec.js
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Render visual contact sheets for every screenshot state
        if: always()
        run: node scripts/visual-contact-sheet.cjs

      - name: Verify all 476 screenshots, observations and SHA-256 manifest
        run: node scripts/check-visual-evidence.cjs

      - name: Upload screenshot matrix, interaction captures, and browser traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farzan-plasmato-edition-v1.0.6-visual-evidence
          path: |
            artifacts/visual-audit/
            test-results/
          if-no-files-found: warn
          retention-days: 90

      - name: Package complete installable static site
        run: |
          mkdir -p release-assets
          (cd dist && zip -q -r ../release-assets/farzan-plasmato-edition-v1.0.6-web.zip .)
          (cd release-assets && sha256sum farzan-plasmato-edition-v1.0.6-web.zip > SHA256SUMS)
          test -f artifacts/visual-audit/manifest.json
          test -f artifacts/visual-audit/VISUAL-REPORT.md
          test -f artifacts/visual-audit/observations.jsonl
          zip -q -r release-assets/farzan-plasmato-edition-v1.0.6-visual-evidence.zip artifacts/visual-audit
          (cd release-assets && sha256sum farzan-plasmato-edition-v1.0.6-visual-evidence.zip > SHA256SUMS.visual)

      - name: Upload verified downloadable app and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farzan-plasmato-edition-v1.0.6-web
          path: release-assets/
          if-no-files-found: error
          retention-days: 90

      - name: Upload static site for GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  build-windows:
    name: Build independent Plasmato Windows NSIS installer
    needs: build-and-verify
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out verified edition source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies and prepare native assets
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run vendor
          if ($LASTEXITCODE -ne 0) { throw "Vendor generation failed" }
          npm run native:prepare
          if ($LASTEXITCODE -ne 0) { throw "Native icon preparation failed" }

      - name: Verify isolated Tauri installer identity and locked prerequisites
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.productName -ne 'Farzan Plasmato Edition' -or $config.identifier -ne 'app.opencoursedeck.plasmato') {
            throw "Plasmato native installer must have an edition-specific product and bundle identifier"
          }
          npm run native:preflight:strict
          if ($LASTEXITCODE -ne 0) { throw "Native preflight failed" }

      - name: Compile real NSIS installer using locked Cargo graph
        run: |
          npm run native:package:locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri Windows installer build failed" }

      - name: Verify and stage the Windows installer
        run: |
          $found = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($found.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($found.Count)" }
          if ($found[0].Length -lt 1000000) { throw "Windows installer is unexpectedly small" }
          New-Item -ItemType Directory -Path 'release-native' -Force | Out-Null
          $dest = 'release-native/farzan-plasmato-edition-v1.0.6-windows-setup.exe'
          Copy-Item -LiteralPath $found[0].FullName -Destination $dest
          $digest = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
          "$digest  farzan-plasmato-edition-v1.0.6-windows-setup.exe" |
            Out-File 'release-native/SHA256SUMS.windows' -Encoding ascii
          Get-Content 'release-native/SHA256SUMS.windows'

      - name: Smoke-test silent Windows NSIS installation
        run: |
          $setup = (Resolve-Path 'release-native/farzan-plasmato-edition-v1.0.6-windows-setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'FarzanPlasmatoInstallAcceptance'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $args = @('/S', "/D=$installDir")
          $process = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent NSIS installer failed: $($process.ExitCode)" }
          if (!(Test-Path $installDir)) { throw "Silent NSIS installer did not create the target directory" }
          $installed = @(Get-ChildItem $installDir -Recurse -File -Filter 'open-course-deck.exe')
          if ($installed.Count -ne 1 -or $installed[0].Length -lt 1000000) {
            throw "Installed native application was not found or is unexpectedly small"
          }
          Write-Host "NSIS silent installation passed: $($installed[0].FullName)"
          # This runner smoke checks installation and bytes, not personal-profile
          # upgrade, WebView2 UI acceptance, code signing, or licensed content.

      - name: Upload verified Windows installer and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farzan-plasmato-edition-v1.0.6-windows
          path: release-native/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish versioned Plasmato Edition download
    needs: [build-and-verify, build-windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified edition bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: farzan-plasmato-edition-v1.0.6-web
          path: release-assets

      - name: Download verified Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: farzan-plasmato-edition-v1.0.6-windows
          path: release-assets

      - name: Verify release bytes and immutable version identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS)
          (cd release-assets && sha256sum -c SHA256SUMS.windows)
          (cd release-assets && sha256sum -c SHA256SUMS.visual)
          tag=plasmato-edition-v1.0.6
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null | grep -E '^[a-f0-9]{40}$' || :)
          if [[ -n "$existing" ]]; then
            echo "::error::Version tag ${tag} already exists (${existing}). Never replace published bytes or move its tag; resolve partial publication separately or increment the patch version."
            exit 1
          fi

      - name: Publish Plasmato Edition v1.0.6
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: plasmato-edition-v1.0.6
          target_commitish: ${{ github.sha }}
          name: Farzan Plasmato Edition v1.0.6
          body: |
            Separately versioned Plasmato edition of Farzan, built from the reviewed main commit and the supplied Plasmato archive.
            Contains 31 imported Plasmato courses (6,418 topics, 5,990 video and 280 PDF references)
            alongside Farzan's existing starter course, plus the standalone emergency player.
            Includes the production website, offline worker and independent NSIS installer, with SHA-256 checksums.
            Visual release acceptance verifies 15 routes across desktop, tablet, mobile and light mode,
            actual saved notes, PDF, flashcards, progress, video/bookmarks, search and Studio persistence.
            Download the visual evidence ZIP for 476 genuine Chrome screenshots in 35 review groups, browser observations, and the image SHA-256 manifest.
            Extract the ZIP and serve it over HTTP(S). External video and PDF hosts are not mirrored.
            This edition is bundled in the main Farzan source but distributed through a distinct edition release channel. Edition version 1.0.6 is independent of the underlying Tauri application version.
          files: |
            release-assets/farzan-plasmato-edition-v1.0.6-web.zip
            release-assets/SHA256SUMS
            release-assets/farzan-plasmato-edition-v1.0.6-windows-setup.exe
            release-assets/SHA256SUMS.windows
            release-assets/farzan-plasmato-edition-v1.0.6-visual-evidence.zip
            release-assets/SHA256SUMS.visual
          fail_on_unmatched_files: true
          overwrite_files: false
          make_latest: false

  verify-published-release:
    name: Re-download and verify published edition assets
    needs: publish-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify tag, expected release asset names and remote SHA-256 bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=plasmato-edition-v1.0.6
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
          if [[ "$actual" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Published tag ${tag} points to ${actual}, not the verified commit ${EXPECTED_COMMIT}."
            exit 1
          fi
          mkdir -p verified-download
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --dir verified-download
          cd verified-download
          expected=(
            farzan-plasmato-edition-v1.0.6-web.zip
            farzan-plasmato-edition-v1.0.6-windows-setup.exe
            farzan-plasmato-edition-v1.0.6-visual-evidence.zip
            SHA256SUMS SHA256SUMS.windows SHA256SUMS.visual
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing expected release asset: $asset"
              exit 1
            fi
          done
          actual_count=$(find . -maxdepth 1 -type f | wc -l)
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "::error::Unexpected release asset set; found ${actual_count} assets, expected ${#expected[@]}."
            exit 1
          fi
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS.windows
          sha256sum -c SHA256SUMS.visual
          {
            echo "## Plasmato Edition v1.0.6 publication verified"
            echo
            echo "Source commit: \`${EXPECTED_COMMIT}\`"
            echo
            echo "All six expected release assets downloaded and verified with SHA-256."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-pages:
    name: Publish Plasmato Edition web application
    # Do not deploy an edition website before the Windows installer AND
    # published immutable release assets have passed remote digest checks.
    needs: verify-published-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PLASMATO_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Plasmato web app
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
