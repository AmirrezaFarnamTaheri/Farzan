name: Archive Latest Plasmato Visual Evidence

on:
  push:
    branches:
      - edition/plasmato-emergency-player-20261011
    paths:
      - .github/workflows/plasmato-evidence-archive.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  export:
    name: Preserve 476 Chrome screenshots on separate evidence branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Plasmato edition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: edition/plasmato-emergency-player-20261011
          persist-credentials: true
          fetch-depth: 1

      - name: Download verified source visual run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: 38230964039
          repository: AmirrezaFarnamTaheri/Farzan
          github-token: ${{ github.token }}
          name: farzan-plasmato-edition-v1.0.4-visual-evidence
          path: _evidence-import

      - name: Verify SHA manifest, screenshot count and pixel files
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const roots = [
            '_evidence-import/artifacts/visual-audit',
            '_evidence-import/visual-audit',
            '_evidence-import',
          ];
          const root = roots.find(root => fs.existsSync(path.join(root, 'manifest.json')));
          if (!root) throw new Error('Verified visual manifest not found in Actions artifact');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          const screenshots = manifest.images;
          if (!Array.isArray(screenshots) || screenshots.length !== 476) {
            throw new Error('Expected exactly 476 captures, got ' + screenshots?.length);
          }
          const sheets = manifest.contactSheets;
          if (!Array.isArray(sheets) || sheets.length !== 35) throw new Error('Expected exactly 35 visual contact sheets');
          const archive = path.join('screenshots', 'v104-reviewed-38230964039');
          fs.mkdirSync(archive, { recursive: true });
          for (const entry of screenshots) {
            const name = entry.path || entry.file;
            if (!name || path.isAbsolute(name) || name.includes('..')) throw new Error('Unsafe screenshot path');
            const candidates = [path.join(root, name), path.join(root, 'screenshots', name)];
            const match = candidates.find(candidate => fs.existsSync(candidate));
            if (!match) throw new Error('Missing capture: ' + name);
            const bytes = fs.readFileSync(match);
            if (bytes.length < 2500 || bytes.subarray(0,8).toString('hex') !== '89504e470d0a1a0a') {
              throw new Error('Invalid PNG: ' + name);
            }
            if (entry.sha256 && crypto.createHash('sha256').update(bytes).digest('hex') !== entry.sha256) {
              throw new Error('SHA-256 mismatch: ' + name);
            }
            const dst = path.join(archive, name);
            fs.mkdirSync(path.dirname(dst), { recursive: true });
            fs.copyFileSync(match, dst);
          }
          for (const record of sheets) {
            const name = record.path;
            if (!/^contact-sheet-[A-Za-z0-9-]+\.png$/.test(name)) throw new Error('Unexpected contact-sheet name: ' + name);
            const bytes = fs.readFileSync(path.join(root, name));
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== record.sha256) throw new Error('Contact-sheet checksum mismatch: '+name);
            const dest = path.join(archive, 'contact-sheets', name);
            fs.mkdirSync(path.dirname(dest), {recursive:true});
            fs.writeFileSync(dest, bytes);
          }
          for (const name of ['manifest.json','observations.jsonl','VISUAL-REPORT.md']) {
            const from = path.join(root, name);
            if (fs.existsSync(from)) fs.copyFileSync(from, path.join(archive, name));
          }
          fs.writeFileSync(path.join(archive, 'README.md'),
            '# Plasmato v1.0.4 browser evidence\n\nOriginal verified run: https://github.com/AmirrezaFarnamTaheri/Farzan/actions/runs/38230964039\n\nAll 476 Chrome PNG screenshots, contact sheets and exact SHA-256 manifest. The evidence branch is separate from both main and the app edition; screenshots are historical until regenerated on a new commit.\n');
          console.log('Verified', screenshots.length, 'PNG captures and', sheets.length, 'contact sheets');
          NODE

      - name: Push verified evidence to independent branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c evidence/plasmato-v104-38230964039
          git add screenshots/v104-reviewed-38230964039
          git commit -m "docs(visual): preserve 476 checksummed Plasmato Chrome captures from verified CI"
          git push origin HEAD:refs/heads/evidence/plasmato-v104-38230964039
