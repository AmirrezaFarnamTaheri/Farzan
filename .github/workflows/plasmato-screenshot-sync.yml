name: Update Plasmato Screenshots from Verified Chrome Captures

on:
  push:
    branches:
      - edition/plasmato-emergency-player-20261011
    paths:
      - .github/workflows/plasmato-screenshot-sync.yml
      - scripts/sync-plasmato-screenshots.cjs
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: plasmato-screenshot-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-screenshots:
    name: Import 107 audited captures into current app screenshot gallery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the dedicated edition branch with push permissions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: edition/plasmato-emergency-player-20261011
          fetch-depth: 1

      - name: Require successful original Chrome acceptance run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh api "repos/${{ github.repository }}/actions/runs/38177326118" --jq '.conclusion')
          test "$result" = success || { echo "::error::Visual source run was not successful: $result"; exit 1; }

      - name: Download original accepted PNGs and observations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plasmato-visual-acceptance-38177326118
          run-id: 38177326118
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: _visual-capture

      - name: Verify screenshot pixels and publish organized gallery
        run: node scripts/sync-plasmato-screenshots.cjs _visual-capture/artifacts/visual-audit

      - name: Commit accepted screenshots without altering main or redesign prototypes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/current \
            screenshots/home.png screenshots/courses.png screenshots/notes.png \
            screenshots/pdf.png screenshots/progress.png screenshots/flashcards.png \
            screenshots/studio.png screenshots/settings.png
          if git diff --cached --quiet; then
            echo "Verified screenshots are already current."
            exit 0
          fi
          git commit -m 'docs(visual): update 107 real Plasmato screenshots and functional evidence'
          git push origin HEAD:edition/plasmato-emergency-player-20261011
