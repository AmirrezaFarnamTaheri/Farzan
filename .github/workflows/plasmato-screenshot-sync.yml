name: Update Plasmato Screenshots from Verified Chrome Captures

on:
  push:
    branches:
      - chore/farzan-v106-screenshot-audit
    paths:
      - .github/workflows/plasmato-screenshot-sync.yml
      - scripts/sync-plasmato-screenshots.cjs
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: plasmato-screenshot-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-screenshots:
    name: Refresh 107 canonical screenshots from immutable v1.0.6 release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out screenshot refresh branch with push permissions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Require successful, commit-matched v1.0.6 release run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh api "repos/${{ github.repository }}/actions/runs/40479110207" --jq '.conclusion')
          test "$result" = success || { echo "::error::Visual source run was not successful: $result"; exit 1; }
          commit=$(gh api "repos/${{ github.repository }}/actions/runs/40479110207" --jq '.head_sha')
          test "$commit" = 8c7d75517ad95df5b8b48081599065bb35db6d7d || { echo "::error::Release source SHA mismatch"; exit 1; }

      - name: Download v1.0.6 checked visual evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: farzan-plasmato-edition-v1.0.6-visual-evidence
          run-id: 40479110207
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: _visual-capture

      - name: Verify screenshot pixels and publish organized gallery
        run: node scripts/sync-plasmato-screenshots.cjs _visual-capture/artifacts/visual-audit

      - name: Commit v1.0.6 captures without altering redesign prototypes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/current \
            screenshots/home.png screenshots/courses.png screenshots/notes.png \
            screenshots/pdf.png screenshots/progress.png screenshots/flashcards.png \
            screenshots/studio.png screenshots/settings.png
          if git diff --cached --quiet; then
            echo "Verified screenshots are already current."
            exit 0
          fi
          git commit -m 'docs(visual): refresh 107 real screenshots from Plasmato v1.0.6'
          git push origin HEAD:${{ github.ref_name }}
