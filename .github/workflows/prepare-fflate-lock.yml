name: Prepare fflate lockfile (integration only)

on:
  push:
    branches:
      - refactor/fflate-vault-zip
    paths:
      - .github/workflows/prepare-fflate-lock.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/fflate-vault-zip
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Generate authoritative package lock and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Prove vault ZIP compatibility using actual unzip
        run: |
          node node_modules/vitest/vitest.mjs run --configLoader runner --pool vmThreads tests/vault-zip.test.js tests/progress.test.js
      - name: Check offline production bundle
        run: |
          npm run vendor
          npm run build:release
          test -f dist/opencoursedeck.js
      - name: Commit lock generated by npm
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches'; exit 0
          fi
          git commit -m 'build(deps): lock pinned fflate for vault ZIP'
          git push origin HEAD:refactor/fflate-vault-zip
