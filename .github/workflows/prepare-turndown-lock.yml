name: Prepare Turndown lockfile (integration only)

on:
  push:
    branches:
      - refactor/turndown-markdown-export
    paths:
      - .github/workflows/prepare-turndown-lock.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/turndown-markdown-export
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Resolve pinned converter dependencies through npm
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm run vendor
      - name: Prove Markdown conversion and full progress export compatibility
        run: |
          node node_modules/vitest/vitest.mjs run --configLoader runner --pool vmThreads tests/markdown-export-turndown.test.js tests/progress.test.js tests/notes.test.js
      - name: Verify offline production build
        run: |
          npm run build:release
          test -f dist/opencoursedeck.js
      - name: Commit npm-generated lockfile for reproducible CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches'
            exit 0
          fi
          git commit -m 'build(deps): lock Turndown and standard GFM extension'
          git push origin HEAD:refactor/turndown-markdown-export
