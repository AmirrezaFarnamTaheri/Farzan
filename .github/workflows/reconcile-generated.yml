name: Reconcile generated artifacts

on:
  push:
    branches:
      - integration/unify-open-prs-2026-08-01

permissions:
  contents: write

concurrency:
  group: reconcile-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.head_commit.message != 'chore(generated): reconcile upgraded vendor assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Check out integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integration/unify-open-prs-2026-08-01
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Regenerate tracked artifacts
        working-directory: far
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm run vendor
          npm run build:release

      - name: Commit exact generated outputs
        env:
          TARGET_BRANCH: integration/unify-open-prs-2026-08-01
        run: |
          git diff --check
          git status --short -- far/vendor far/dist
          if git diff --quiet -- far/vendor far/dist; then
            echo 'Generated artifacts are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add far/vendor far/dist
          git commit -m 'chore(generated): reconcile upgraded vendor assets'
          git push origin "HEAD:${TARGET_BRANCH}"
