name: Refresh dependency-generated offline assets (integration only)

on:
  push:
    branches:
      - integration/farzan-deps-library-first-20261027
    paths:
      - .github/workflows/refresh-integration-generated.yml

permissions:
  contents: write

concurrency:
  group: farzan-refresh-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: integration/farzan-deps-library-first-20261027
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Reproduce CI dependency tree and offline build
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm run vendor
          npm run build:release
      - name: Commit tracked regenerated assets to integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- vendor
          # dist is untracked build output; stage only committed offline assets.
          if git diff --cached --quiet; then
            echo 'All committed assets already match the dependency graph.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'build(generated): refresh vendored assets for consolidated dependency graph'
          git push origin HEAD:integration/farzan-deps-library-first-20261027
