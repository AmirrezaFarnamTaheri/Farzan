name: Release

run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v1.1.3)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_commit: ${{ steps.identity.outputs.commit }}
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Require an authoritative trigger
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Manual releases must be dispatched from refs/heads/main, not $DISPATCH_REF. Select main in the workflow branch picker and dispatch the existing release tag again." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG. Supply an existing semantic-version tag such as v1.1.2." >&2
            exit 1
          fi

      - name: Check out the exact release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release project layout
        working-directory: .
        run: |
          test -f far/package.json || {
            echo "Release tag $RELEASE_TAG does not contain far/package.json. Create the tag from a main commit that contains the release project, then dispatch that existing tag." >&2
            exit 1
          }
          test -f far/package-lock.json || {
            echo "Release tag $RELEASE_TAG does not contain far/package-lock.json. Commit the lockfile on main, create a matching release tag from that commit, then dispatch the tag again." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: far/package-lock.json

      - name: Verify release identity
        id: identity
        working-directory: far
        run: |
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Release tag does not exist locally: $RELEASE_TAG. Create and push the tag before dispatching the release workflow." >&2
            exit 1
          }

          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$release_commit" ]]; then
            echo "Checked-out commit $head_commit does not match $RELEASE_TAG ($release_commit). Do not move release tags; dispatch the workflow for the immutable tag commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "Release commit $release_commit is not reachable from main. Merge the intended commit to main and create a new version tag from that main commit." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $expected_tag. Update package.json before tagging, or dispatch the tag that matches the committed package version." >&2
            exit 1
          fi

          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies reproducibly
        working-directory: far
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Vendor browser dependencies
        working-directory: far
        run: npm run vendor

      - name: Check encoding
        working-directory: far
        run: npm run check:encoding

      - name: Check workflow invariants
        working-directory: far
        run: npm run check:workflows

      - name: Validate repository
        working-directory: far
        run: npm run validate

      - name: Lint source
        working-directory: far
        run: npm run lint

      - name: Build release
        working-directory: far
        run: npm run build:release

      - name: Verify generated output
        working-directory: far
        run: npm run check:generated

      - name: Verify committed generated files are current
        working-directory: far
        run: |
          status_file="$(mktemp)"
          git status --porcelain=v1 --untracked-files=all -- dist vendor > "$status_file"
          if [[ -s "$status_file" ]]; then
            cat "$status_file"
            git diff --stat -- dist vendor
            echo "Release generation changed committed dist/vendor content. Regenerate and commit those files on main, then create a new release tag." >&2
            exit 1
          fi

      - name: Run tests
        working-directory: far
        run: npm test

      - name: Audit production dependencies
        working-directory: far
        run: npm audit --omit=dev --audit-level=high

      - name: Audit project rules
        working-directory: far
        run: npm run audit

      - name: Generate bundle report
        working-directory: far
        run: npm run report:bundle

      - name: Run smoke tests
        working-directory: far
        run: npm run smoke

      - name: Run browser smoke tests
        working-directory: far
        run: npm run smoke:browser

      - name: Generate final release attestation
        working-directory: far
        env:
          SOURCE_VERSION: ${{ steps.identity.outputs.commit }}
        run: npm run release:attest

      - name: Run adversarial release integrity checks
        working-directory: far
        env:
          SOURCE_VERSION: ${{ steps.identity.outputs.commit }}
        run: node scripts/adversarial-release-test.cjs

      - name: Reverify final release contents
        working-directory: far
        env:
          SOURCE_VERSION: ${{ steps.identity.outputs.commit }}
        run: npm run release:verify

      - name: Package immutable release assets
        working-directory: far
        env:
          SOURCE_VERSION: ${{ steps.identity.outputs.commit }}
        run: |
          archive="opencoursedeck-${RELEASE_TAG}.tar.gz"
          manifest="opencoursedeck-${RELEASE_TAG}-manifest.json"
          attestation="opencoursedeck-${RELEASE_TAG}-attestation.json"

          rm -rf release-assets
          mkdir -p release-assets
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "release-assets/$archive" \
            dist
          cp reports/release/release-manifest.json "release-assets/$manifest"
          cp reports/release/release-attestation.json "release-assets/$attestation"

          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('reports/release/release-manifest.json', 'utf8'));
          const attestation = JSON.parse(fs.readFileSync('reports/release/release-attestation.json', 'utf8'));
          const expectedVersion = process.env.RELEASE_TAG.slice(1);
          const expectedCommit = process.env.SOURCE_VERSION.toLowerCase();
          for (const [name, document] of [['manifest', manifest], ['attestation', attestation]]) {
            if (document.version !== expectedVersion) {
              throw new Error(`${name} version ${document.version} does not match ${expectedVersion}`);
            }
            if (document.commit !== expectedCommit) {
              throw new Error(`${name} commit ${document.commit} does not match ${expectedCommit}`);
            }
          }
          if (attestation.verified !== true) {
            throw new Error('Release attestation is not verified');
          }
          NODE

          (
            cd release-assets
            sha256sum "$archive" "$manifest" "$attestation" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: far/release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Re-check the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect tag movement
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.release_commit }}
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          actual_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "Release tag moved from $EXPECTED_COMMIT to $actual_commit. Restore the immutable tag reference and investigate before publishing." >&2
            exit 1
          fi

      - name: Download verified release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Verify downloaded assets
        shell: bash --noprofile --norc -eo pipefail {0}
        run: cd release-assets && sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.build.outputs.release_commit }}
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.json
            release-assets/SHA256SUMS
