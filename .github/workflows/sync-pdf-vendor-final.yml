name: Commit patched PDF.js ESM assets

on:
  push:
    branches: [codex/full-audit-remediation]
    paths: [.github/workflows/sync-pdf-vendor-final.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: |
          cd far
          npm ci --ignore-scripts --legacy-peer-deps
          cp node_modules/pdfjs-dist/build/pdf.min.mjs vendor/pdf.min.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs vendor/pdf.worker.min.mjs
          rm -f vendor/pdf.min.js vendor/pdf.worker.min.js
      - name: Commit vendor assets
        run: |
          rm .github/workflows/sync-pdf-vendor-final.yml
          rm -f far/reports-pdf-vendor.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A far/vendor far/reports-pdf-vendor.txt .github/workflows/sync-pdf-vendor-final.yml
          git commit -m "build: stage patched PDF.js ESM assets"
          git push origin HEAD:codex/full-audit-remediation
