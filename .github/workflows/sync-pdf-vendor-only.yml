name: Diagnose PDF vendor synchronization

on:
  push:
    branches: [codex/full-audit-remediation]
    paths: [.github/workflows/sync-pdf-vendor-only.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/full-audit-remediation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Capture vendor command results
        shell: bash
        run: |
          cd far
          set +e
          log=reports-pdf-vendor.txt
          : > "$log"
          run() { printf '\n=== %s ===\n' "$*" >> "$log"; "$@" >> "$log" 2>&1; printf 'exit=%s\n' "$?" >> "$log"; }
          run npm ci --ignore-scripts --legacy-peer-deps
          run cp node_modules/pdfjs-dist/build/pdf.min.mjs vendor/pdf.min.mjs
          run cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs vendor/pdf.worker.min.mjs
          run rm -f vendor/pdf.min.js vendor/pdf.worker.min.js
          run ls -lh vendor/pdf.min.mjs vendor/pdf.worker.min.mjs
          run git status --short vendor
      - name: Commit diagnostics
        run: |
          rm .github/workflows/sync-pdf-vendor-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add far/reports-pdf-vendor.txt .github/workflows/sync-pdf-vendor-only.yml
          git commit -m "chore: diagnose PDF vendor synchronization"
          git push origin HEAD:codex/full-audit-remediation
