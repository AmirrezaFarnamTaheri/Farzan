<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="fc-title fc-desc">
  <title id="fc-title">OpenCourseDeck — SM-2 Flashcard Review</title>
  <desc id="fc-desc">Active spaced repetition review session with card flip simulation, 4 recall grade buttons, retention stats, and heatmaps.</desc>
  <defs>
    <!-- Multi-tier shadows -->
    <filter id="shadow-xs" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>
    <filter id="shadow-md" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.09"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-modal" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#0F172A" flood-opacity="0.30"/>
    </filter>
    <filter id="glow-lapis" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2563EB" flood-opacity="0.45"/>
    </filter>
    <filter id="glow-mark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#EA580C" flood-opacity="0.40"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="grad-rail-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="grad-lapis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="grad-dark-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Canvas Dot Pattern -->
    <pattern id="dot-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#E2DDD2"/>
    </pattern>

    <style>
      .tf  {{ font-family: 'Fraunces', Georgia, serif; }}
      .tm  {{ font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }}
      .tmo {{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }}
      
      .st-rule   {{ stroke: #DEDAD1; stroke-width: 1; fill: none; }}
      .st-thread {{ stroke: #2563EB; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }}
    </style>
  </defs>
  <rect width="1440" height="960" fill="#F8F6F1"/>
  <rect width="1440" height="960" fill="url(#dot-pattern)"/>
  <!-- ==================== COMPLETE NAVIGATION RAIL ==================== -->
  <g id="rail">
    <rect width="248" height="960" fill="url(#grad-rail)"/>
    <line x1="248" y1="0" x2="248" y2="960" stroke="#1E293B" stroke-width="1.2"/>
    <g id="rail-brand" transform="translate(14, 18)">
      <rect width="220" height="58" rx="12" fill="url(#grad-rail-card)" stroke="rgba(255,255,255,0.09)" stroke-width="1" filter="url(#shadow-sm)"/>
      <rect x="10" y="10" width="38" height="38" rx="10" fill="url(#grad-lapis)" filter="url(#glow-lapis)"/>
      <polygon points="29,16 21,30 27,30 23,42 37,27 31,27" fill="#FFFFFF"/>
      <text x="58" y="28" class="tm" font-size="14.5" font-weight="800" fill="#F8FAFC">OpenCourseDeck</text>
      <text x="58" y="44" class="tmo" font-size="9.5" font-weight="600" fill="#94A3B8">LOCAL STUDIO · v2.4</text>
    </g>
    <g id="rail-search" transform="translate(14, 86)">
      <rect width="220" height="36" rx="8" fill="#141E33" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="24" cy="18" r="5" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
      <line x1="28" y1="22" x2="33" y2="27" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="42" y="22" class="tm" font-size="12.5" fill="#64748B">Quick search…</text>
      <rect x="182" y="8" width="28" height="20" rx="4" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="187" y="22" class="tmo" font-size="10" font-weight="700" fill="#94A3B8">⌘K</text>
    </g>
    <text x="24" y="148" class="tm" font-size="10" font-weight="800" fill="#64748B" letter-spacing="0.12em">WORKSPACES</text>
    <g id="nav-today">
      <g transform="translate(24, 175) scale(0.75)">
        <path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h4a1 1 0 001-1V10" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="52" y="189" class="tm" font-size="13" font-weight="500" fill="#CBD5E1">Today</text>
    </g>
    <g id="nav-library">
      <g transform="translate(24, 215) scale(0.75)">
        <path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="52" y="229" class="tm" font-size="13" font-weight="500" fill="#CBD5E1">Library</text>
    </g>
    <g id="nav-learn">
      <g transform="translate(24, 255) scale(0.75)">
        <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="52" y="269" class="tm" font-size="13" font-weight="500" fill="#CBD5E1">Learn</text>
    </g>
    <g id="nav-make">
      <g transform="translate(24, 295) scale(0.75)">
        <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="52" y="309" class="tm" font-size="13" font-weight="500" fill="#CBD5E1">Make</text>
    </g>
    <g id="nav-studio">
      <g transform="translate(24, 335) scale(0.75)">
        <path d="M12 2l10 6-10 6-10-6 10-6zm-10 11l10 6 10-6m-20 5l10 6 10-6" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="52" y="349" class="tm" font-size="13" font-weight="500" fill="#CBD5E1">Studio</text>
    </g>
    <g id="nav-flashcards">
      <rect x="12" y="366" width="224" height="36" rx="9" fill="url(#grad-lapis)" filter="url(#glow-lapis)"/>
      <g transform="translate(24, 375) scale(0.75)">
        <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="52" y="389" class="tm" font-size="13" font-weight="700" fill="#FFFFFF">Flashcards</text>
      <circle cx="218" cy="384" r="3" fill="#BFDBFE"/>
    </g>
    <g id="nav-insights">
      <g transform="translate(24, 415) scale(0.75)">
        <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="52" y="429" class="tm" font-size="13" font-weight="500" fill="#CBD5E1">Insights</text>
    </g>
    <g id="rail-now-playing" transform="translate(14, 690)">
      <rect width="220" height="74" rx="10" fill="url(#grad-rail-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#shadow-sm)"/>
      <rect x="10" y="10" width="54" height="36" rx="6" fill="#020617"/>
      <polygon points="34,24 42,28 34,32" fill="#3B82F6"/>
      <text x="72" y="24" class="tm" font-size="11.5" font-weight="700" fill="#F8FAFC">Lec 04: Replication</text>
      <text x="72" y="38" class="tmo" font-size="9.5" fill="#94A3B8">MIT 6.824 · 26:10</text>
      <rect x="10" y="56" width="200" height="4" rx="2" fill="#1E293B"/>
      <rect x="10" y="56" width="136" height="4" rx="2" fill="url(#grad-lapis)"/>
    </g>
    <g id="rail-storage" transform="translate(14, 778)">
      <rect width="220" height="88" rx="10" fill="url(#grad-rail-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#shadow-sm)"/>
      <text x="12" y="22" class="tmo" font-size="10" font-weight="700" fill="#94A3B8">VAULT STORAGE (INDEXEDDB)</text>
      <rect x="12" y="32" width="196" height="6" rx="3" fill="#1E293B"/>
      <rect x="12" y="32" width="58" height="6" rx="3" fill="#10B981"/>
      <text x="12" y="54" class="tmo" font-size="10" fill="#CBD5E1">14.2 MB / 500 MB (3%)</text>
      <text x="12" y="72" class="tmo" font-size="9.5" font-weight="700" fill="#38BDF8">🔒 Zero-Cloud Local Vault</text>
    </g>
    <g id="rail-profile" transform="translate(14, 880)">
      <line x1="0" y1="0" x2="220" y2="0" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="20" cy="38" r="16" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>
      <text x="14" y="43" class="tm" font-size="11.5" font-weight="800" fill="#93C5FD">FZ</text>
      <text x="46" y="33" class="tm" font-size="13" font-weight="700" fill="#F8FAFC">Farzan</text>
      <text x="46" y="48" class="tmo" font-size="10" fill="#94A3B8">Pro Scholar · 142 Cards</text>
      <circle cx="200" cy="38" r="14" fill="#141E33" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="194" y="43" class="tm" font-size="14" fill="#94A3B8">⚙</text>
    </g>
  </g>
  <!-- ==================== TOP BAR WITH NOTIFICATIONS ==================== -->
  <g id="topbar">
    <rect x="248" y="0" width="1192" height="68" fill="#FFFEFB" stroke="#DEDAD1" stroke-width="1"/>
    <text x="280" y="41" class="tf" font-size="21" font-weight="700" fill="#18212E">Flashcards · SM-2 Active Recall Deck</text>
    <g id="keyboard-cues" transform="translate(670, 21)">
      <rect width="230" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" class="tmo" font-size="11" font-weight="500" fill="#64748B"><tspan font-weight="700" fill="#2563EB">N</tspan> Note   <tspan font-weight="700" fill="#C2410C">R</tspan> Review   <tspan font-weight="700" fill="#2563EB">/</tspan> Search   <tspan font-weight="700" fill="#047857">C</tspan> Canvas</text>
    </g>
    <g id="topbar-notifications" transform="translate(1040, 20)">
      <circle cx="16" cy="14" r="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <path d="M12 11a4 4 0 018 0c0 4.5 2 6 2 6H10s2-1.5 2-6m3 9a2 2 0 01-2-2h4a2 2 0 01-2 2" stroke="#475569" stroke-width="1.6" fill="none"/>
      <circle cx="24" cy="6" r="4.5" fill="#EF4444"/>
    </g>
    <g id="topbar-actions" transform="translate(1085, 16)">
      <rect width="110" height="36" rx="8" fill="#F1F5F9" stroke="#DEDAD1" stroke-width="1"/>
      <text x="14" y="23" class="tm" font-size="12.5" font-weight="600" fill="#18212E">Decks (4) ▾</text>
      <rect x="120" y="0" width="115" height="36" rx="8" fill="url(#grad-terracotta)" filter="url(#shadow-sm)"/>
      <text x="134" y="23" class="tm" font-size="12.5" font-weight="700" fill="#FFFFFF">+ New Card</text>
    </g>
  </g>

  <!-- MAIN STAGE (720px CARD + 380px STATS) -->
  <g id="flashcard-content" transform="translate(280, 88)">
    
    <!-- LEFT COLUMN: ACTIVE FLASHCARD STAGE -->
    <g id="card-stage" filter="url(#shadow-lg)">
      <rect width="720" height="490" rx="16" fill="#FFFFFF" stroke="#DEDAD1" stroke-width="1"/>
      
      <!-- Top Card Header -->
      <g transform="translate(32, 28)">
        <rect width="130" height="26" rx="6" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1"/>
        <text x="10" y="17" class="tmo" font-size="11" font-weight="700" fill="#C2410C">CARD 2 OF 3 DUE</text>
        
        <text x="440" y="18" class="tmo" font-size="11" fill="#64748B">Source: MIT 6.824 (Lec 04 [26:10])</text>
        <line x1="0" y1="42" x2="656" y2="42" stroke="#E2E8F0" stroke-width="1"/>
      </g>
      
      <!-- Card Question Body (Prompt) -->
      <g transform="translate(32, 100)">
        <text x="0" y="24" class="tmo" font-size="12" font-weight="700" fill="#2563EB">PROMPT / CLOZE QUESTION</text>
        <text x="0" y="60" class="tf" font-size="22" font-weight="700" fill="#18212E">In state machine replication, why must the primary wait for the backup to acknowledge disk persistence before replying to the client?</text>
      </g>
      
      <!-- Card Answer Block (Flipped State) -->
      <g transform="translate(32, 220)">
        <rect width="656" height="130" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
        <text x="20" y="28" class="tmo" font-size="11" font-weight="700" fill="#047857">ANSWER / INVARIANT</text>
        <text x="20" y="56" class="tm" font-size="14" fill="#18212E">To prevent <tspan font-weight="700" fill="#2563EB">split-brain divergence</tspan>. If the primary crashes immediately after responding, the backup could become the new leader without having recorded the committed transition, thereby violating linearizability.</text>
        <text x="20" y="106" class="tmo" font-size="11" fill="#64748B">Ease Factor: 2.50 · Interval: 6 days → 14 days</text>
      </g>
      
      <!-- 4 Recall Grade Action Buttons -->
      <g id="recall-grade-buttons" transform="translate(32, 380)">
        <!-- Again (1) -->
        <g transform="translate(0, 0)">
          <rect width="150" height="54" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
          <text x="48" y="24" class="tm" font-size="13" font-weight="700" fill="#DC2626">Again (1)</text>
          <text x="56" y="42" class="tmo" font-size="10.5" fill="#EF4444">&lt; 1 min</text>
        </g>
        
        <!-- Hard (2) -->
        <g transform="translate(168, 0)">
          <rect width="150" height="54" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
          <text x="52" y="24" class="tm" font-size="13" font-weight="700" fill="#D97706">Hard (2)</text>
          <text x="56" y="42" class="tmo" font-size="10.5" fill="#F59E0B">10 min</text>
        </g>

        <!-- Good (3 - Highlighted) -->
        <g transform="translate(336, 0)">
          <rect width="150" height="54" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
          <text x="50" y="24" class="tm" font-size="13" font-weight="700" fill="#2563EB">Good (3)</text>
          <text x="58" y="42" class="tmo" font-size="10.5" font-weight="700" fill="#2563EB">4 days</text>
        </g>

        <!-- Easy (4) -->
        <g transform="translate(504, 0)">
          <rect width="150" height="54" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
          <text x="52" y="24" class="tm" font-size="13" font-weight="700" fill="#047857">Easy (4)</text>
          <text x="56" y="42" class="tmo" font-size="10.5" fill="#10B981">14 days</text>
        </g>
      </g>
    </g>
    
    <!-- RIGHT COLUMN: DECK METRICS & RETENTION STABILITY -->
    <g id="deck-metrics-sidebar" transform="translate(750, 0)" filter="url(#shadow-md)">
      <rect width="370" height="490" rx="16" fill="#FFFFFF" stroke="#DEDAD1" stroke-width="1"/>
      
      <g transform="translate(24, 24)">
        <text x="0" y="16" class="tmo" font-size="11" font-weight="700" fill="#C2410C">DECK TELEMETRY</text>
        <text x="0" y="38" class="tf" font-size="20" font-weight="700" fill="#18212E">Distributed Systems Deck</text>
        <text x="0" y="58" class="tm" font-size="12.5" fill="#5D6875">48 total cards · 3 due today · 45 mature</text>
        <line x1="0" y1="72" x2="322" y2="72" stroke="#E2E8F0" stroke-width="1"/>
        
        <!-- Retention Stability Dial -->
        <g transform="translate(0, 88)">
          <circle cx="40" cy="40" r="36" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
          <text x="22" y="48" class="tf" font-size="22" font-weight="800" fill="#C2410C">94%</text>
          <text x="92" y="32" class="tm" font-size="14" font-weight="700" fill="#18212E">Retention Stability</text>
          <text x="92" y="52" class="tm" font-size="12" fill="#5D6875">Top 5% optimal recall memory</text>
        </g>

        <!-- Interval Distribution Bars -->
        <g transform="translate(0, 186)">
          <text x="0" y="16" class="tmo" font-size="10.5" font-weight="700" fill="#64748B">INTERVAL BREAKDOWN</text>
          
          <g transform="translate(0, 30)">
            <text x="0" y="12" class="tm" font-size="12" fill="#18212E">&lt; 1 Week (Learning)</text>
            <text x="280" y="12" class="tmo" font-size="11" font-weight="700" fill="#18212E">6</text>
            <rect y="18" width="322" height="6" rx="3" fill="#EDE9DC"/>
            <rect y="18" width="40" height="6" rx="3" fill="#F59E0B"/>
          </g>

          <g transform="translate(0, 70)">
            <text x="0" y="12" class="tm" font-size="12" fill="#18212E">1–4 Weeks (Young)</text>
            <text x="272" y="12" class="tmo" font-size="11" font-weight="700" fill="#18212E">14</text>
            <rect y="18" width="322" height="6" rx="3" fill="#EDE9DC"/>
            <rect y="18" width="94" height="6" rx="3" fill="#3B82F6"/>
          </g>

          <g transform="translate(0, 110)">
            <text x="0" y="12" class="tm" font-size="12" fill="#18212E">&gt; 1 Month (Mature)</text>
            <text x="272" y="12" class="tmo" font-size="11" font-weight="700" fill="#047857">28</text>
            <rect y="18" width="322" height="6" rx="3" fill="#EDE9DC"/>
            <rect y="18" width="188" height="6" rx="3" fill="#047857"/>
          </g>
        </g>
        
        <!-- Deck Settings Link -->
        <g transform="translate(0, 370)">
          <rect width="322" height="38" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
          <text x="80" y="24" class="tm" font-size="12.5" font-weight="600" fill="#18212E">Configure SM-2 Parameters →</text>
        </g>
      </g>
    </g>
  </g>
</svg>