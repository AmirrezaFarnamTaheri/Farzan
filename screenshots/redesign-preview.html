<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCourseDeck — Redesign Concept SVGs Gallery</title>
  <style>
    :root {
      --bg: #0F172A;
      --surface: #1E293B;
      --surface-2: #334155;
      --border: rgba(255, 255, 255, 0.1);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --focus: #3B82F6;
      --success: #10B981;
    }
    body.paper {
      --bg: #F7F5F0;
      --surface: #FFFEFB;
      --surface-2: #EDE9DC;
      --border: #DEDAD1;
      --text: #18212E;
      --text-muted: #5D6875;
      --focus: #2457D6;
      --success: #087B5D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: background 0.2s, color 0.2s;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: var(--surface-2);
      border-color: var(--focus);
    }
    .btn.active {
      background: var(--focus);
      color: #FFFFFF;
      border-color: var(--focus);
    }
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      min-height: 700px;
      position: relative;
    }
    .svg-frame {
      width: 100%;
      max-width: 1440px;
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid var(--border);
    }
    .svg-frame img, .svg-frame object {
      width: 100%;
      height: auto;
      display: block;
    }
    .meta-bar {
      width: 100%;
      max-width: 1440px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>OpenCourseDeck Design System &amp; Wireframe Hub</h1>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">8 Core Redesign SVGs · 20 Vector Icons · 12 Pixel Sprites · Hallmark &amp; De-Slop Validated</p>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <span class="badge">✓ XML Validated</span>
      <button class="btn" onclick="toggleTheme(this)">Toggle Paper Theme</button>
    </div>
  </header>

  <div class="nav-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
    <div class="nav-tabs">
      <button class="btn active" onclick="loadScreen('redesign-concept.svg', 'Today (Desk Home)', this)">1. Today</button>
      <button class="btn" onclick="loadScreen('redesign-library.svg', 'Library &amp; Curriculum', this)">2. Library</button>
      <button class="btn" onclick="loadScreen('redesign-learn.svg', 'Learn &amp; Studio Player', this)">3. Learn</button>
      <button class="btn" onclick="loadScreen('redesign-make.svg', 'Make Studio', this)">4. Make</button>
      <button class="btn" onclick="loadScreen('redesign-studio-canvas.svg', 'Studio 2D Canvas', this)">5. Studio Canvas</button>
      <button class="btn" onclick="loadScreen('redesign-flashcards.svg', 'SM-2 Flashcards', this)">6. Flashcards</button>
      <button class="btn" onclick="loadScreen('redesign-insights.svg', 'Insights &amp; Telemetry', this)">7. Insights</button>
      <button class="btn" onclick="loadScreen('redesign-settings.svg', 'Settings Sheet', this)">8. Settings</button>
    </div>
    <div style="display: flex; gap: 8px;">
      <a class="btn" href="../assets/icons/icons-preview.html" target="_blank">✨ Vector Icons (20) →</a>
      <a class="btn" href="../assets/pixel/pixel-preview.html" target="_blank">👾 Pixel Sprites (12) →</a>
    </div>
  </div>

  <div class="view-container">
    <div class="meta-bar">
      <strong id="screenTitle" style="color: var(--text);">Screen: Today (Home)</strong>
      <span id="screenMeta">File: redesign-concept.svg · 1440×960 viewBox</span>
    </div>
    <div class="svg-frame">
      <img id="svgDisplay" src="redesign-concept.svg" alt="Wireframe Concept">
    </div>
  </div>

  <script>
    function loadScreen(file, title, btn) {
      document.getElementById('svgDisplay').src = file;
      document.getElementById('screenTitle').innerText = 'Screen: ' + title;
      document.getElementById('screenMeta').innerText = 'File: ' + file + ' · 1440×960 viewBox';
      document.querySelectorAll('.nav-tabs .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    function toggleTheme(btn) {
      document.body.classList.toggle('paper');
      btn.innerText = document.body.classList.contains('paper') ? 'Toggle Dark Theme' : 'Toggle Paper Theme';
    }
  </script>
</body>
</html>
