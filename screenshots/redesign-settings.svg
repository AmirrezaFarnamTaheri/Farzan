<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="set-title set-desc">
  <title id="set-title">OpenCourseDeck — Settings Modal View</title>
  <desc id="set-desc">Anchored settings modal dialog with appearance theme selector, typography steppers, AI privacy boundaries, and local data export controls.</desc>
  <defs>
    <!-- Multi-tier shadows -->
    <filter id="shadow-xs" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.03"/>
    </filter>
    <filter id="shadow-md" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.09"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-modal" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#0F172A" flood-opacity="0.30"/>
    </filter>
    <filter id="glow-lapis" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2563EB" flood-opacity="0.45"/>
    </filter>
    <filter id="glow-mark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#EA580C" flood-opacity="0.40"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="grad-rail-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="grad-lapis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="grad-lapis-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="grad-terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="grad-dark-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="grad-card-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Canvas Dot Pattern -->
    <pattern id="dot-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#E2DDD2"/>
    </pattern>

    <style>
      .tf  {{ font-family: 'Fraunces', Georgia, serif; }}
      .tm  {{ font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }}
      .tmo {{ font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Courier New', monospace; }}
      
      .c-ink       {{ fill: #18212E; }}
      .c-muted     {{ fill: #5D6875; }}
      .c-faint     {{ fill: #8A9BAF; }}
      .c-white     {{ fill: #FFFFFF; }}
      .c-lapis     {{ fill: #2563EB; }}
      .c-mark      {{ fill: #C2410C; }}
      .c-success   {{ fill: #047857; }}
      
      .st-rule     {{ stroke: #DEDAD1; stroke-width: 1; fill: none; }}
      .st-focus    {{ stroke: #2563EB; stroke-width: 2; fill: none; }}
      .st-thread   {{ stroke: #2563EB; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }}
    </style>
  </defs>
  <!-- Base Background -->
  <rect width="1440" height="960" fill="#F8F6F1"/>
  <rect width="1440" height="960" fill="url(#dot-pattern)"/>
  <!-- ==================== ENHANCED RAIL ==================== -->
  <g id="rail">
    <rect width="248" height="960" fill="url(#grad-rail)"/>
    <line x1="248" y1="0" x2="248" y2="960" stroke="#1E293B" stroke-width="1.2"/>
    <g id="rail-brand" transform="translate(14, 18)">
      <rect width="220" height="64" rx="12" fill="url(#grad-rail-card)" stroke="rgba(255,255,255,0.09)" stroke-width="1" filter="url(#shadow-sm)"/>
      <rect x="12" y="12" width="40" height="40" rx="10" fill="url(#grad-lapis)" filter="url(#glow-lapis)"/>
      <polygon points="32,18 24,34 30,34 26,46 40,30 34,30" fill="#FFFFFF"/>
      <text x="62" y="30" class="tm" font-size="14.5" font-weight="800" fill="#F8FAFC" letter-spacing="-0.01em">OpenCourseDeck</text>
      <text x="62" y="47" class="tmo" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="0.08em">LOCAL STUDIO · v2.4</text>
    </g>
    <g id="rail-search" transform="translate(14, 94)">
      <rect width="220" height="38" rx="9" fill="#141E33" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <path d="M14 11a5 5 0 100-10 5 5 0 000 10zm6-1l3.5 3.5" transform="translate(10, 8) scale(0.9)" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="44" y="24" class="tm" font-size="13" fill="#64748B">Search or jump...</text>
      <rect x="180" y="8" width="30" height="22" rx="5" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="186" y="23" class="tmo" font-size="10.5" font-weight="700" fill="#94A3B8">⌘K</text>
    </g>
    <text x="24" y="158" class="tm" font-size="10" font-weight="800" fill="#64748B" letter-spacing="0.12em">WORKSPACES</text>
    <g id="nav-today">
      <rect x="12" y="176" width="224" height="40" rx="10" fill="url(#grad-lapis)" filter="url(#glow-lapis)"/>
      <g transform="translate(24, 186) scale(0.85)">
        <path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h4a1 1 0 001-1V10" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="54" y="201" class="tm" font-size="13.5" font-weight="700" fill="#FFFFFF">Today</text>
      <circle cx="218" cy="196" r="3.5" fill="#BFDBFE"/>
    </g>
    <g id="nav-library">
      <g transform="translate(24, 232) scale(0.85)">
        <path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="54" y="247" class="tm" font-size="13.5" font-weight="500" fill="#CBD5E1">Library</text>
    </g>
    <g id="nav-learn">
      <g transform="translate(24, 278) scale(0.85)">
        <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="54" y="293" class="tm" font-size="13.5" font-weight="500" fill="#CBD5E1">Learn</text>
    </g>
    <g id="nav-make">
      <g transform="translate(24, 324) scale(0.85)">
        <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="54" y="339" class="tm" font-size="13.5" font-weight="500" fill="#CBD5E1">Make</text>
    </g>
    <g id="nav-insights">
      <g transform="translate(24, 370) scale(0.85)">
        <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="54" y="385" class="tm" font-size="13.5" font-weight="500" fill="#CBD5E1">Insights</text>
    </g>
    <g id="rail-telemetry-badge" transform="translate(14, 746)">
      <rect width="220" height="124" rx="12" fill="url(#grad-rail-card)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#shadow-sm)"/>
      <text x="14" y="24" class="tmo" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="0.06em">STUDY MOMENTUM</text>
      <rect x="14" y="36" width="32" height="32" rx="8" fill="rgba(234,88,12,0.18)"/>
      <path d="M30 44c0 5-3.5 8.5-8 8.5s-7-3.5-7-7c0-4.5 4.5-9 6-12.5 2 3.5 9 7.5 9 11z" fill="url(#grad-terracotta)"/>
      <text x="54" y="50" class="tm" font-size="13.5" font-weight="800" fill="#F8FAFC">7 Day Streak</text>
      <text x="54" y="64" class="tmo" font-size="10" font-weight="600" fill="#34D399">Top 5% Consistency</text>
      <rect x="14" y="82" width="192" height="6" rx="3" fill="#1E293B"/>
      <rect x="14" y="82" width="154" height="6" rx="3" fill="url(#grad-lapis)"/>
      <text x="14" y="106" class="tmo" font-size="10" fill="#94A3B8">Weekly Goal: 4.8 / 6.0 hrs</text>
    </g>
    <g id="rail-profile" transform="translate(14, 888)">
      <line x1="0" y1="0" x2="220" y2="0" stroke="#1E293B" stroke-width="1.2"/>
      <circle cx="20" cy="36" r="16" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>
      <text x="14" y="41" class="tm" font-size="11.5" font-weight="800" fill="#93C5FD">FZ</text>
      <text x="46" y="31" class="tm" font-size="13" font-weight="700" fill="#F8FAFC">Farzan</text>
      <text x="46" y="46" class="tmo" font-size="10" fill="#94A3B8">Pro Scholar · 142 Cards</text>
      <g transform="translate(186, 24)">
        <circle cx="12" cy="12" r="14" fill="#141E33" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <path d="M12 7v10M7 12h10" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <!-- ==================== ENHANCED TOP BAR ==================== -->
  <g id="topbar">
    <rect x="248" y="0" width="1192" height="68" fill="#FFFEFB" stroke="#DEDAD1" stroke-width="1"/>
    <text x="280" y="41" class="tf" font-size="21" font-weight="700" fill="#18212E" letter-spacing="-0.02em">Today · Research Desk</text>
    <g id="keyboard-cues" transform="translate(710, 21)">
      <rect width="210" height="28" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="18" class="tmo" font-size="11" font-weight="500" fill="#64748B"><tspan font-weight="700" fill="#2563EB">N</tspan> Note   <tspan font-weight="700" fill="#C2410C">R</tspan> Review   <tspan font-weight="700" fill="#2563EB">/</tspan> Search</text>
    </g>
    <g id="topbar-actions" transform="translate(1090, 16)"></g>
  </g>

  <!-- Frosted Scrim Overlay -->
  <rect width="1440" height="960" fill="rgba(11, 19, 43, 0.68)"/>

  <!-- CENTERED SETTINGS MODAL (880 x 620 px) -->
  <g id="settings-modal-dialog" transform="translate(360, 156)" filter="url(#shadow-modal)">
    <rect width="880" height="628" rx="16" fill="#FFFFFF" stroke="#DEDAD1" stroke-width="1"/>
    
    <!-- Modal Header -->
    <g transform="translate(32, 28)">
      <text x="0" y="24" class="tf" font-size="22" font-weight="700" fill="#18212E">Preferences &amp; Workspace Settings</text>
      <text x="0" y="46" class="tm" font-size="13" fill="#5D6875">Customize themes, typography, spaced repetition intervals, and privacy controls.</text>
      
      <!-- Close button -->
      <g transform="translate(780, 0)">
        <circle cx="16" cy="16" r="16" fill="#F1F5F9"/>
        <path d="M11 11l10 10m0-10L11 21" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    
    <line x1="0" y1="86" x2="880" y2="86" stroke="#E2E8F0" stroke-width="1"/>

    <!-- MODAL BODY -->
    <g transform="translate(0, 86)">
      
      <!-- Sidebar Navigation -->
      <g id="modal-sidebar">
        <rect width="220" height="542" fill="#F8FAFC"/>
        <line x1="220" y1="0" x2="220" y2="542" stroke="#E2E8F0" stroke-width="1"/>
        
        <text x="32" y="44" class="tm" font-size="13.5" font-weight="500" fill="#5D6875">General Workspace</text>
        
        <!-- Active Nav item: Appearance -->
        <rect x="16" y="64" width="192" height="38" rx="8" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
        <text x="32" y="88" class="tm" font-size="13.5" font-weight="700" fill="#2563EB">Appearance &amp; Type</text>
        
        <text x="32" y="132" class="tm" font-size="13.5" font-weight="500" fill="#5D6875">Spaced Repetition</text>
        <text x="32" y="176" class="tm" font-size="13.5" font-weight="500" fill="#5D6875">AI &amp; Local Privacy</text>
        <text x="32" y="220" class="tm" font-size="13.5" font-weight="500" fill="#5D6875">Data Vault &amp; Export</text>
      </g>
      
      <!-- Settings Form Controls -->
      <g id="modal-form" transform="translate(250, 24)">
        
        <!-- Section 1: Color Themes -->
        <text x="0" y="20" class="tm" font-size="14" font-weight="700" fill="#18212E">Color Theme</text>
        <text x="0" y="38" class="tm" font-size="12.5" fill="#5D6875">Choose your preferred study backdrop and contrast level.</text>
        
        <g id="theme-swatches" transform="translate(0, 50)">
          <!-- Swatch 1: Lapis Paper (Selected) -->
          <rect width="130" height="74" rx="8" fill="#F8F6F1" stroke="#2563EB" stroke-width="2"/>
          <rect x="8" y="8" width="114" height="24" rx="4" fill="#0B132B"/>
          <rect x="16" y="14" width="12" height="12" rx="3" fill="#2563EB"/>
          <text x="14" y="58" class="tm" font-size="12" font-weight="700" fill="#18212E">Lapis Paper</text>
          <text x="88" y="58" class="tmo" font-size="10" font-weight="700" fill="#2563EB">✓</text>
          
          <!-- Swatch 2: Dark Void -->
          <g transform="translate(145, 0)">
            <rect width="130" height="74" rx="8" fill="#0F172A" stroke="#E2E8F0" stroke-width="1"/>
            <rect x="8" y="8" width="114" height="24" rx="4" fill="#1E293B"/>
            <rect x="16" y="14" width="12" height="12" rx="3" fill="#7C3AED"/>
            <text x="14" y="58" class="tm" font-size="12" font-weight="600" fill="#FFFFFF">Dark Void</text>
          </g>

          <!-- Swatch 3: Midnight OLED -->
          <g transform="translate(290, 0)">
            <rect width="130" height="74" rx="8" fill="#000000" stroke="#E2E8F0" stroke-width="1"/>
            <rect x="8" y="8" width="114" height="24" rx="4" fill="#111111"/>
            <rect x="16" y="14" width="12" height="12" rx="3" fill="#06B6D4"/>
            <text x="14" y="58" class="tm" font-size="12" font-weight="600" fill="#FFFFFF">Midnight OLED</text>
          </g>

          <!-- Swatch 4: Warm Sepia -->
          <g transform="translate(435, 0)">
            <rect width="130" height="74" rx="8" fill="#FAF5E8" stroke="#E2E8F0" stroke-width="1"/>
            <rect x="8" y="8" width="114" height="24" rx="4" fill="#EADCC0"/>
            <rect x="16" y="14" width="12" height="12" rx="3" fill="#C2410C"/>
            <text x="14" y="58" class="tm" font-size="12" font-weight="600" fill="#18212E">Warm Sepia</text>
          </g>
        </g>
        
        <line x1="0" y1="148" x2="590" y2="148" stroke="#E2E8F0" stroke-width="1"/>

        <!-- Section 2: Typography Stepper -->
        <g transform="translate(0, 168)">
          <text x="0" y="20" class="tm" font-size="14" font-weight="700" fill="#18212E">Typography &amp; Base Text Size</text>
          <text x="0" y="38" class="tm" font-size="12.5" fill="#5D6875">Default body copy size across notes, books, and transcripts.</text>
          
          <g transform="translate(0, 52)">
            <rect width="70" height="34" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
            <text x="22" y="22" class="tm" font-size="13" font-weight="600" fill="#18212E">14px</text>

            <rect x="80" y="0" width="85" height="34" rx="6" fill="#2563EB"/>
            <text x="96" y="22" class="tm" font-size="13" font-weight="700" fill="#FFFFFF">16px (Def)</text>

            <rect x="175" y="0" width="70" height="34" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
            <text x="197" y="22" class="tm" font-size="13" font-weight="600" fill="#18212E">18px</text>

            <rect x="255" y="0" width="70" height="34" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
            <text x="277" y="22" class="tm" font-size="13" font-weight="600" fill="#18212E">20px</text>
          </g>
        </g>
        
        <line x1="0" y1="280" x2="590" y2="280" stroke="#E2E8F0" stroke-width="1"/>

        <!-- Section 3: Privacy & Local Storage -->
        <g transform="translate(0, 300)">
          <text x="0" y="20" class="tm" font-size="14" font-weight="700" fill="#18212E">Local-First Storage &amp; Privacy</text>
          <rect y="32" width="580" height="76" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          
          <circle cx="28" cy="70" r="14" fill="#ECFDF5"/>
          <text x="22" y="75" class="tm" font-size="14" font-weight="700" fill="#047857">🔒</text>
          
          <text x="56" y="60" class="tm" font-size="13" font-weight="700" fill="#18212E">Zero Cloud Telemetry Guarantee</text>
          <text x="56" y="80" class="tm" font-size="12" fill="#5D6875">All video transcripts, Cornell notes, and SM-2 flashcard ease factors are stored strictly inside your local browser vault.</text>
        </g>
        
        <!-- Action Buttons -->
        <g transform="translate(0, 424)">
          <rect width="130" height="40" rx="8" fill="#2563EB" filter="url(#shadow-sm)"/>
          <text x="24" y="25" class="tm" font-size="13" font-weight="700" fill="#FFFFFF">Save Changes</text>
          
          <rect x="144" y="0" width="130" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
          <text x="168" y="25" class="tm" font-size="13" font-weight="600" fill="#18212E">Reset Defaults</text>
        </g>
      </g>
    </g>
  </g>
</svg>